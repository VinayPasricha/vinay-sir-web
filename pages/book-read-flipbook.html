<!DOCTYPE html>
<html lang="en">
<head>
  <script defer src="../js/analytics.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Read: AI For Business Leaders — Vinay Pasricha</title>
  <meta name="description" content="Read AI For Business Leaders as a flipbook. By Vinay Pasricha.">
  <link rel="canonical" href="https://vinaypasricha.com/pages/book-read-flipbook.html">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="shortcut icon" href="/favicon.png">

  <!-- StPageFlip — open-source flipbook (MIT licensed) -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <style>
    :root {
      --paper: #f5efe1;
      --paper-edge: #e8dec5;
      --ink: #2c2416;
      --ink-soft: #5c4a32;
      --ink-faint: #9c8b72;
      --accent: #8b6914;
      --accent-soft: #f0e5c7;
      --bg: #1a1611;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Subtle vignette background */
    body::before {
      content: ''; position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.5) 100%);
      pointer-events: none; z-index: 0;
    }

    /* Top bar */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between;
      z-index: 10;
      background: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent);
      pointer-events: none;
    }
    .topbar a, .topbar button {
      pointer-events: auto;
    }
    .back-link {
      color: #d4c9a8;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.5px;
      padding: 8px 12px;
      border-radius: 2px;
      transition: background 0.2s;
    }
    .back-link:hover { background: rgba(255,255,255,0.08); }

    .book-title-bar {
      color: #c9b88a;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .toolbar {
      display: flex; gap: 8px;
    }
    .tool-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: #d4c9a8;
      width: 36px; height: 36px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.15s;
    }
    .tool-btn:hover { background: rgba(255,255,255,0.12); transform: translateY(-1px); }
    .tool-btn:active { transform: translateY(0); }

    /* Book stage */
    .stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 1;
      padding: 70px 80px 96px;
    }
    @media (max-width: 768px) {
      .stage { padding: 56px 8px 86px; }
    }

    /* Shadow is on the book stage wrapper so it doesn't create a stacking context
       on the element that holds the flipping pages (which breaks their transforms). */
    .book-shadow {
      position: relative;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 10px 20px rgba(0,0,0,0.3);
      border-radius: 2px;
    }
    /* Clip anything that escapes the book box during flip animation. */
    #book {
      position: relative;
    }

    /* Each page styling — StPageFlip renders each .page as a flipbook leaf */
    .page {
      background: var(--paper);
      color: var(--ink);
      overflow: hidden;
      position: relative;
      background-image:
        repeating-linear-gradient(
          90deg,
          transparent 0,
          transparent 2px,
          rgba(139, 105, 20, 0.015) 2px,
          rgba(139, 105, 20, 0.015) 4px
        ),
        radial-gradient(ellipse at top left, rgba(139, 105, 20, 0.04) 0%, transparent 50%),
        radial-gradient(ellipse at bottom right, rgba(139, 105, 20, 0.03) 0%, transparent 50%);
    }

    .page-content {
      padding: 56px 52px 64px;
      height: 100%;
      width: 100%;
      display: block;
      font-size: 15.5px;
      line-height: 1.65;
      color: var(--ink);
    }
    @media (max-width: 768px) {
      .page-content { padding: 42px 30px 56px; font-size: 14.5px; line-height: 1.6; }
    }

    .page-content p {
      margin: 0 0 12px;
      text-align: left;
      -webkit-hyphens: auto;
      hyphens: auto;
      orphans: 2;
      widows: 2;
    }
    .page-content p:first-child { text-indent: 0; }
    .page-content p + p { text-indent: 1.4em; }

    /* Chapter title page — full page with just chapter number + title centered */
    .page.ch-divider .ch-divider-inner {
      padding: 80px 50px;
      height: 100%; width: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
    }
    .ch-divider-inner .ch-num {
      font-size: 12px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 36px;
    }
    .ch-divider-inner .ornament-top,
    .ch-divider-inner .ornament-bottom {
      width: 60px; height: 1px;
      background: var(--accent);
      opacity: 0.5;
      margin: 0 auto;
    }
    .ch-divider-inner .ornament-top { margin-bottom: 28px; }
    .ch-divider-inner .ornament-bottom { margin-top: 28px; }
    .ch-divider-inner .ch-title {
      font-size: 32px;
      line-height: 1.25;
      margin: 0;
      font-weight: 700;
      color: var(--ink);
      font-style: italic;
      max-width: 80%;
    }
    @media (max-width: 768px) {
      .ch-divider-inner .ch-title { font-size: 24px; }
      .page.ch-divider .ch-divider-inner { padding: 60px 30px; }
    }

    /* Page number footer */
    .page-num {
      position: absolute;
      bottom: 24px;
      font-size: 11px;
      color: var(--ink-faint);
      letter-spacing: 1px;
    }
    .page.left .page-num { left: 55px; }
    .page.right .page-num { right: 55px; }
    .page:not(.left):not(.right) .page-num { left: 50%; transform: translateX(-50%); }

    /* Running header (chapter name) */
    .running-head {
      position: absolute;
      top: 24px;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--ink-faint);
      font-weight: 600;
    }
    .page.left .running-head { left: 55px; }
    .page.right .running-head { right: 55px; }

    /* Cover page — uses the actual book cover image */
    .page.cover {
      background: #1a1208;
      background-image: none;
      padding: 0;
      overflow: hidden;
    }
    .page.cover .cover-img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    /* Back of cover (inside-cover) */
    .page.cover-back {
      background: #1a1208;
      background-image:
        radial-gradient(ellipse at center, rgba(201,162,74,0.08) 0%, transparent 70%);
      color: #d4c9a8;
    }
    .cover-back-inner {
      padding: 60px 50px;
      height: 100%; width: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
    }
    .cover-back-inner .imprint {
      font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
      color: #c9a24a; margin-bottom: 28px; font-weight: 600;
    }
    .cover-back-inner .ornament {
      font-size: 18px; color: #c9a24a; margin: 14px 0;
    }
    .cover-back-inner .subtitle {
      font-size: 14px; font-style: italic; color: #d4c9a8;
      max-width: 320px; line-height: 1.6; margin-bottom: 36px;
    }
    .cover-back-inner .author-block {
      margin-top: 24px;
    }
    .cover-back-inner .by-label {
      font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
      color: #8b7a52; margin-bottom: 6px;
    }
    .cover-back-inner .author {
      font-size: 16px; color: #d4c9a8; font-style: italic;
    }

    /* TOC page */
    .toc-inner { padding: 60px 52px; height: 100%; width: 100%; overflow: hidden; }
    .toc-inner h2 {
      font-size: 24px; font-weight: 700; margin: 0 0 8px;
      letter-spacing: 2px; text-transform: uppercase; color: var(--accent);
      text-align: center;
    }
    .toc-inner .toc-rule {
      width: 50px; height: 1px; background: var(--accent); opacity: 0.5;
      margin: 0 auto 28px;
    }
    .toc-list { list-style: none; padding: 0; margin: 0; }
    .toc-list li {
      padding: 8px 0;
      font-size: 13.5px;
      line-height: 1.4;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: baseline;
      gap: 8px;
      cursor: pointer;
      transition: color 0.2s;
      color: var(--ink-soft);
    }
    .toc-list li:hover { color: var(--accent); }
    .toc-list .toc-title-wrap {
      display: flex; align-items: baseline; gap: 10px;
      overflow: hidden;
    }
    .toc-list .toc-title-text {
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-style: italic;
    }
    .toc-list .toc-dots {
      flex: 1;
      border-bottom: 1px dotted rgba(139, 105, 20, 0.35);
      transform: translateY(-3px);
      min-width: 12px;
    }
    .toc-list .toc-page {
      color: var(--ink-faint); font-size: 12px; font-variant-numeric: tabular-nums;
      min-width: 24px; text-align: right;
    }
    .toc-list .toc-num {
      color: var(--accent); font-size: 10px; letter-spacing: 1.5px;
      font-weight: 700; min-width: 36px;
      text-transform: uppercase;
    }

    /* Bottom controls */
    .controls {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 18px 24px;
      gap: 16px;
      z-index: 10;
      background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
      pointer-events: none;
    }
    .controls > * { pointer-events: auto; }
    .nav-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #d4c9a8;
      width: 44px; height: 44px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.15s;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }
    .nav-btn:active { transform: scale(0.95); }
    .nav-btn:disabled { opacity: 0.3; cursor: default; transform: none; }

    .page-indicator {
      color: #c9b88a;
      font-size: 13px;
      min-width: 80px;
      text-align: center;
      letter-spacing: 1px;
    }

    /* Loading state */
    .loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
      color: #c9a24a;
      font-size: 14px;
      letter-spacing: 2px;
      z-index: 100;
    }
    .loading.hidden { display: none; }
    .loading-spinner {
      width: 40px; height: 40px;
      border: 2px solid rgba(201, 162, 74, 0.2);
      border-top-color: #c9a24a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Measuring container (off-screen) */
    .page-measure {
      position: fixed; left: -9999px; top: 0;
      visibility: hidden; pointer-events: none;
    }

    /* Hide topbar/controls in fullscreen */
    body.fs .topbar, body.fs .controls { opacity: 0.15; transition: opacity 0.3s; }
    body.fs .topbar:hover, body.fs .controls:hover { opacity: 1; }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="loading-spinner"></div>
    <span>Preparing the book…</span>
  </div>

  <div class="topbar">
    <a href="book.html" class="back-link">← Back to Book Page</a>
    <div class="book-title-bar">AI For Business Leaders</div>
    <div class="toolbar">
      <button class="tool-btn" id="toc-btn" title="Table of Contents">☰</button>
      <button class="tool-btn" id="fs-btn" title="Fullscreen">⛶</button>
    </div>
  </div>

  <div class="stage">
    <div class="book-shadow">
      <div id="book"></div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prev-btn" aria-label="Previous page">‹</button>
    <div class="page-indicator" id="page-indicator">1 / 1</div>
    <button class="nav-btn" id="next-btn" aria-label="Next page">›</button>
  </div>

  <script src="book-read-content.js"></script>
  <script>
    (function () {
      const CHAPTERS = window.AI_BOOK_CHAPTERS || [];
      const BOOK_META = {
        imprint: 'The Company Brain Series',
        title: 'AI For Business Leaders',
        subtitle: 'A Practical Guide to AI Strategy, Operations, and Governance',
        author: 'Vinay Pasricha'
      };

      // Page dimensions
      function getDims() {
        const isMobile = window.innerWidth <= 768;
        const stageW = window.innerWidth - (isMobile ? 20 : 160);
        const stageH = window.innerHeight - 140;
        // Maintain 5:7 portrait page ratio
        const maxPageH = Math.min(stageH, 820);
        const idealPageH = Math.min(maxPageH, isMobile ? stageH : 800);
        let pageH = idealPageH;
        let pageW = Math.round(pageH * (5/7));
        // For spread (two pages), width is 2*pageW. If that exceeds stage width, shrink.
        if (!isMobile) {
          const spreadW = pageW * 2;
          if (spreadW > stageW) {
            pageW = Math.floor(stageW / 2);
            pageH = Math.round(pageW * (7/5));
          }
        } else {
          if (pageW > stageW) { pageW = stageW; pageH = Math.round(pageW * (7/5)); }
        }
        return { pageW, pageH, isMobile };
      }

      // Escape HTML
      function esc(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Paginate chapters into fixed-height pages.
      // Each chapter starts with a dedicated divider page (just title), then body pages.
      function paginate(chapters, pageW, pageH) {
        const measure = document.createElement('div');
        measure.className = 'page-measure';
        measure.style.width = pageW + 'px';
        document.body.appendChild(measure);

        const result = [];

        for (let ci = 0; ci < chapters.length; ci++) {
          const ch = chapters[ci];

          // 1. Chapter divider page
          result.push({ type: 'divider', chapter: ch.title, num: ch.num, title: ch.title });

          // 2. Body pages — content starts fresh, no inline header (it's on the divider)
          let currentBody = '';
          const paras = ch.content.slice();
          let i = 0;

          while (i < paras.length) {
            const nextP = `<p>${esc(paras[i])}</p>`;
            const trial = currentBody + nextP;
            measure.innerHTML = `<div class="page-content" style="width:${pageW}px;height:${pageH}px;">${trial}</div>`;
            const inner = measure.firstChild;

            // 4px tolerance to avoid edge-case overflow due to subpixel rendering
            const overflows = inner.scrollHeight > inner.clientHeight + 4;

            if (overflows && currentBody !== '') {
              result.push({ type: 'text', chapter: ch.title, body: currentBody });
              currentBody = '';
            } else {
              currentBody = trial;
              i++;
            }
          }
          if (currentBody.trim()) {
            result.push({ type: 'text', chapter: ch.title, body: currentBody });
          }
        }

        measure.remove();
        return result;
      }

      function buildCoverPage() {
        return `<img class="cover-img" src="../assets/images/book-cover-hd.jpg" alt="${esc(BOOK_META.title)} — book cover" />`;
      }

      function buildCoverBackPage() {
        return `
          <div class="cover-back-inner">
            <div class="imprint">${esc(BOOK_META.imprint)}</div>
            <div class="ornament">◆</div>
            <div class="subtitle">${esc(BOOK_META.subtitle)}</div>
            <div class="author-block">
              <div class="by-label">Written by</div>
              <div class="author">${esc(BOOK_META.author)}</div>
            </div>
          </div>
        `;
      }

      function buildTOCPage(chapters, chapterStartPages) {
        // Use a short chapter label: "Note", "1", "2", ... so layout is clean
        function shortNum(num) {
          const m = String(num).match(/(\d+)/);
          if (m) return m[1].padStart(2, '0');
          // Non-chapter labels (e.g. "PREFACE", "NOTE TO THE READER") get a dash
          return '—';
        }
        const items = chapters.map((ch, i) => {
          const page = chapterStartPages[i] != null ? (chapterStartPages[i] + 1) : '';
          return `
            <li data-chapter="${i}">
              <span class="toc-num">${esc(shortNum(ch.num))}</span>
              <span class="toc-title-wrap">
                <span class="toc-title-text">${esc(ch.title)}</span>
                <span class="toc-dots"></span>
              </span>
              <span class="toc-page">${page}</span>
            </li>
          `;
        }).join('');
        return `
          <div class="toc-inner">
            <h2>Contents</h2>
            <div class="toc-rule"></div>
            <ul class="toc-list">${items}</ul>
          </div>
        `;
      }

      let pageFlip = null;

      async function build() {
        const stage = document.getElementById('book');
        stage.innerHTML = '';

        const { pageW, pageH, isMobile } = getDims();
        const pagedContent = paginate(CHAPTERS, pageW, pageH);

        // Compute chapter-start page numbers (0-indexed for pageFlip.turnToPage)
        // Layout: cover (0), inside-cover (1), TOC (2), then paged content starts at 3.
        // Each chapter's first page is its divider.
        const PRE_PAGES = 3;
        const chapterStartPages = [];
        pagedContent.forEach((p, idx) => {
          if (p.type === 'divider') {
            const chIndex = CHAPTERS.findIndex(c => c.title === p.title);
            if (chIndex >= 0 && chapterStartPages[chIndex] == null) {
              chapterStartPages[chIndex] = PRE_PAGES + idx;
            }
          }
        });

        const allPages = [];
        allPages.push({ kind: 'cover', html: buildCoverPage() });
        allPages.push({ kind: 'cover-back', html: buildCoverBackPage() });
        allPages.push({ kind: 'toc', html: buildTOCPage(CHAPTERS, chapterStartPages) });

        pagedContent.forEach((p) => {
          if (p.type === 'divider') {
            allPages.push({
              kind: 'divider',
              chapter: p.chapter,
              html: `<div class="ch-divider-inner">
                <div class="ch-num">${esc(p.num)}</div>
                <div class="ornament-top"></div>
                <h2 class="ch-title">${esc(p.title)}</h2>
                <div class="ornament-bottom"></div>
              </div>`
            });
          } else {
            allPages.push({
              kind: 'text',
              chapter: p.chapter,
              html: `<div class="page-content">${p.body}</div>`
            });
          }
        });

        // Build DOM
        allPages.forEach((pg, idx) => {
          const el = document.createElement('div');
          let cls = 'page';
          if (pg.kind === 'cover') cls += ' cover';
          if (pg.kind === 'cover-back') cls += ' cover-back';
          if (pg.kind === 'divider') cls += ' ch-divider';
          el.className = cls;
          el.style.width = pageW + 'px';
          el.style.height = pageH + 'px';

          let inner = pg.html;
          if (pg.kind === 'text') {
            const runningHead = pg.chapter ? `<div class="running-head">${esc(pg.chapter)}</div>` : '';
            inner = runningHead + inner + `<div class="page-num">${idx + 1}</div>`;
          }
          el.innerHTML = inner;
          stage.appendChild(el);
        });

        // Init StPageFlip
        if (pageFlip) {
          try { pageFlip.destroy(); } catch(e){}
          pageFlip = null;
        }
        pageFlip = new St.PageFlip(stage, {
          width: pageW,
          height: pageH,
          size: 'fixed',
          minWidth: 200,
          maxWidth: 1200,
          minHeight: 280,
          maxHeight: 1680,
          maxShadowOpacity: 0.6,
          showCover: true,
          mobileScrollSupport: false,
          usePortrait: isMobile,
          autoSize: false,
          drawShadow: true,
          flippingTime: 900,
          useMouseEvents: true,
          swipeDistance: 30,
          showPageCorners: false,
          disableFlipByClick: false
        });
        pageFlip.loadFromHTML(document.querySelectorAll('#book .page'));

        // Update indicator
        const indicator = document.getElementById('page-indicator');
        const total = pageFlip.getPageCount();
        function updateIndicator() {
          const curr = pageFlip.getCurrentPageIndex() + 1;
          indicator.textContent = `${curr} / ${total}`;
        }
        updateIndicator();
        pageFlip.on('flip', updateIndicator);

        // Hook TOC clicks
        document.querySelectorAll('.toc-list li').forEach(li => {
          li.addEventListener('click', () => {
            const chIdx = parseInt(li.dataset.chapter, 10);
            const page = chapterStartPages[chIdx];
            if (page != null) pageFlip.turnToPage(page);
          });
        });

        // Hide loading
        document.getElementById('loading').classList.add('hidden');
      }

      // Nav buttons
      document.getElementById('prev-btn').addEventListener('click', () => pageFlip && pageFlip.flipPrev());
      document.getElementById('next-btn').addEventListener('click', () => pageFlip && pageFlip.flipNext());

      // Keyboard
      document.addEventListener('keydown', (e) => {
        if (!pageFlip) return;
        if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); pageFlip.flipNext(); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); pageFlip.flipPrev(); }
      });

      // TOC button — jump to TOC page
      document.getElementById('toc-btn').addEventListener('click', () => {
        if (pageFlip) pageFlip.turnToPage(1);
      });

      // Fullscreen
      document.getElementById('fs-btn').addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen?.().then(() => document.body.classList.add('fs'));
        } else {
          document.exitFullscreen?.().then(() => document.body.classList.remove('fs'));
        }
      });

      // Resize handler — rebuild on significant size changes
      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          const currIdx = pageFlip ? pageFlip.getCurrentPageIndex() : 0;
          build().then(() => {
            if (pageFlip && currIdx > 0) pageFlip.turnToPage(currIdx);
          });
        }, 300);
      });

      // Initial build
      if (CHAPTERS.length === 0) {
        document.getElementById('loading').textContent = 'No content found.';
      } else {
        // Defer slightly so layout settles
        requestAnimationFrame(() => requestAnimationFrame(build));
      }
    })();
  </script>
</body>
</html>
