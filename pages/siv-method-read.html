        num: 'PREFACE',
        title: 'Preface',
        time: '7 min',
        content: [
          "Most failure does not begin in action. It begins in misunderstanding.",
          "People act too soon because they think they understand. They decide too early because uncertainty irritates them. They label reality before they have seen enough of it, then mistake conviction for truth, speed for clarity, and familiarity for understanding. Then they call the result judgement.",
          "This is not mainly a moral defect. It is a structural limitation.",
          "The human mind is not built to hold many frames of reference at once with rigour. It evolved for survival, not for comprehensive perception. It simplifies, compresses, protects, and closes. It wants a workable story before reality has finished disclosing itself. In ordinary life that may be efficient. In serious work it is often catastrophic.",
          "In medicine, a young doctor sees a patient with chest pain and thinks: heart attack. The mind settles on a frame because it is the most alarming, most present, most familiar from recent cases. The tests that would challenge this frame do not get ordered. Or they do get ordered, but are read through the lens that has already been adopted. The ambiguous EKG is forced into confirmation. The patient is admitted to coronary care. Days later, the true cause — gastroesophageal reflux, a muscular strain, anxiety — emerges. But by then the mind of the entire care team has been captured by the first narrative. The harm is not death. It is years of the patient's life lived under the shadow of a diagnosis that was borrowed, not earned.",
          "In relationships, a partner becomes withdrawn. The receiving partner thinks: infidelity. The mind seizes on the explanation that is most emotionally available, most consistent with past anxieties. The withdrawn partner is interrogated, not inquired into. Their actual reasons — depression, stress at work, shame about a financial mistake, a diagnosis they haven't disclosed — remain unspoken because the frame has already closed. By the time the real cause is finally spoken aloud, months of damage have been done.",
          "In work, a leader sees a promising direction and mistakes early evidence for durable reality. The plan gathers support, resources collect around it, and doubt becomes expensive. A year later it becomes clear that the opportunity was narrower, the timing was wrong, or the assumptions were thin. The confidence was real. The understanding was not.",
          "In each case, the failure is not due to stupidity or negligence. It is due to a normal human tendency: the mind closes around an interpretation because closed interpretations allow action, and action feels like progress. Uncertainty is intrinsically uncomfortable. The pressure to resolve uncertainty — to have a story, a plan, a definitive answer — is immense. Most of us yield to it before we have actually examined enough of reality to justify yielding.",
          "This book proposes a different relationship to that pressure. It proposes that understanding and action are not the same thing, and should not be collapsed into one another. It proposes that there is a kind of work — hard, disciplined, sustained work — that happens in the space between the moment you first think you understand something and the moment you actually do. It proposes that this work is not a luxury or a side effect of action. It is a prerequisite to action that deserves to succeed.",
          "SIV stands for Socratic Iterative Vinay. It is a method for examining an important reality through multiple dynamically generated lenses, applying disciplined pressure to every claim, and converging toward one integrated understanding strong enough to support action.",
          "Its core proposition is simple and severe: before power is applied, reality must be examined hard enough to deserve action.",
          "This book is the first formal statement of that proposition. It is not a philosophy. It is not a productivity system. It is not a therapeutic method or a mindfulness practice. It is a method for people who work — who make decisions, lead others, build things, treat systems, shape outcomes — and who are tired of paying the cost of shallow interpretation.",
          "The cost is visible and invisible both. The visible cost is the outcome that fails. The invisible cost is slower and more insidious: it is the trust that corrodes when decisions keep failing, the confidence that hollows when you realise you have been wrong about something you were certain about.",
          "What SIV offers is not certainty. No method can offer that. What it offers is a structured path from premature conviction to earned understanding. It offers a discipline for people who want to act, but want to act on something more substantial than the first plausible story their mind produces.",
          "It is not intended as the last word. It is intended as the opening move."

          "The second failure always comes first.",
          "The first serious mistake is almost never the one you notice. It happens earlier, quieter, deeper inside the frame. It happens in the moment you decide you understand something before you actually do. It happens when a feeling of clarity arrives before the work of clarity has been completed. That feeling is the most dangerous product of the untrained mind. It is the sensation of understanding without the substance of it.",
          "The first distortion is not ignorance. It is the sensation of understanding without the substance of it.",
          "A woman discovers a lump in her breast. She is thirty-four. She has no family history. She tells herself it is probably a cyst — not because she has evidence, but because the alternative is terrifying, and terror is expensive, and she is in the middle of a difficult quarter at work. She waits three months. When she finally sees a doctor, the lump has grown. It is not a cyst. The treatment that would have been straightforward in month one is now aggressive and uncertain in month four.",
          "She did not fail at execution. She failed at seeing. She looked at reality and decided what it was before she had examined it carefully enough to know.",
          "This is the first distortion. Not ignorance. Not stupidity. Not carelessness. Something more structural: the human tendency to close interpretation before reality has finished disclosing itself.",
          "The distortion operates through a peculiar mental move. The woman did not simply ignore the lump. She interpreted it. She assigned it a category, a timeline, a meaning. That assignment felt like understanding because it had the shape of understanding. She had a theory. The theory was coherent. It fit some facts. But it had never been tested against the full range of what she actually knew.",
          "A man stays in a relationship for two years past the point where it should have ended. Not because he is weak. Because he has built an interpretation — she is difficult but loyal, the fights are temporary, the good outweighs the bad — and that interpretation has become load-bearing. His identity leans on it. His plans depend on it. He became what might be called a sophisticated interpreter of his own delusion — brilliant at explaining why the evidence fit the story, incapable of asking whether the story fit the evidence.",

          "This is the first thing SIV addresses. Not bad thinking. Not laziness. Not dishonesty. The structural gap between the feeling of understanding and the fact of it. That gap is where the real cost lives — in relationships, in health, in money, in career, in every domain where people confuse the speed of their interpretation with its quality.",

          "The mind wants relief. SIV demands reality.",
          "The human mind does not primarily seek truth. It seeks resolution.",
          "This is not a controversial statement in neuroscience, but it is a devastating one in practice. It means that the organ you are using to understand reality is structurally biased toward ending inquiry rather than completing it. It wants the discomfort of not-knowing to stop. It wants an answer — not necessarily the right answer, but an answer that will let it move on.",
          "Watch this in real time. A man goes to the doctor with persistent fatigue. The doctor runs standard blood work. Everything comes back normal. The man feels relieved. He tells himself it must be stress, or sleep, or age. He stops investigating. The fatigue continues for another year. Eventually a different doctor orders a more specific panel and discovers a thyroid condition that was invisible on the first set of tests. The condition was worsening the entire time he thought he had ruled it out.",
          "The first doctor was not negligent. But the man's mind did something subtle and dangerous: it treated the absence of a clear answer as the presence of a benign one. The mind saw no diagnosis and converted it to no problem. The relief was real. The understanding was not. And the relief itself became the barrier to further inquiry.",

          "The pattern scales. A team has a strategic disagreement about which market to enter. They debate for two hours. Eventually, the most senior person in the room offers a framing that sounds reasonable, and the room agrees. People leave feeling aligned. But the alignment is not the product of genuine convergence. It is the product of fatigue, hierarchy, and the mind's desire to stop holding contradictions.",

          "The result is predictable. We overvalue what is visible, recent, vivid, emotional, and narratively satisfying. We undervalue what is structural, slow-moving, distributed, and hidden. We attach identity to interpretation. We defend a view not because it is true but because it has become part of us.",
          "Intelligence does not save you from this. It often makes it worse. A clever person with a wrong frame can generate elegant reasoning that sounds like understanding and is actually sophisticated avoidance. Intelligence can increase the quality of the narrative without increasing its contact with reality. The smartest person in the room can be the one most skilled at constructing a story that lets everyone go home early.",
          "SIV is built to interrupt that process. Not by making you smarter. By giving you a structure that forces inquiry past the point where the mind would naturally stop. It is a system for more rigour — for asking the questions that relief wants you to leave unasked, for holding the tension that comfort wants you to resolve, for examining the frame even after the frame has started to feel true.",

          "The plausible answer is the most dangerous enemy of the true one.",
          "There is a moment in every serious inquiry where the mind wants to declare victory and move on. That moment almost always arrives too soon.",
          "Premature closure is not impatience. It is the structural tendency of human cognition to convert partial understanding into complete understanding, and then to act on the converted product as though no gap existed. One moment you are thinking about a problem. The next moment you have an answer. The gap between the two is invisible to the person making it.",
          "A man in his late thirties has been experiencing chest pain for two weeks. He decides the pain is reflux-related and adjusts his diet. The pain persists but he does not return to the doctor because his interpretation has closed the inquiry. He has an answer. The answer is wrong. Six weeks later, he is in an emergency room with a cardiac event that might have been prevented if the inquiry had stayed open.",
          "He did not ignore the symptom. He interpreted it. The interpretation was plausible. It was wrong. And it closed the door on further investigation at exactly the point where further investigation was most needed.",
          "This is the particular danger of premature closure: it is not experienced as premature. It is experienced as complete. The person feels like they have finished thinking when they have actually stopped thinking.",
          "Premature closure operates identically in emotional life. A woman discovers that her partner has been exchanging messages with an ex. He apologises. She accepts this. The inquiry closes. But what closed? Not the underlying question — why did he feel the need to maintain a private emotional channel outside the relationship? What closed was her willingness to tolerate the discomfort of not having a clean answer. His apology functioned not as truth but as relief.",
          "The apology was real. The resolution was real. The understanding was not. What actually happened was a mutual agreement to stop asking. And the underlying dynamic — whatever emotional absence or unmet need had driven him to seek connection elsewhere — remained unaddressed and unexamined.",

          "The pattern is everywhere. In career decisions, where a person accepts a job because the salary is right without examining whether the role aligns with anything they actually want to build. In medical decisions, where a diagnosis is accepted because it explains the most obvious symptom without accounting for the less visible ones. In financial decisions, where an investment thesis is adopted because it is narratively compelling without being stress-tested against contradictory evidence.",
          "In every case, the structure is the same. Partial information produces a plausible interpretation. The plausible interpretation produces emotional relief. The emotional relief is experienced as cognitive completion.",
          "There is a particular danger in premature closure that deserves its own attention: it is harder to reopen an inquiry than to keep one open. Once the mind has assigned a conclusion, that conclusion becomes part of the cognitive furniture. New evidence that contradicts it must compete against the existing interpretation, and the existing interpretation has the advantage of incumbency.",
          "This is why SIV insists on a specific discipline: depth must be chosen deliberately, and inquiry must not close until the chosen depth has been reached. Left to its own devices, the mind will always declare sufficiency too soon.",

          "The mechanism is neurological. Memory does not encode source. When a belief settles into long-term storage, the pathway by which it arrived is often discarded. A false belief that has been well-integrated into the system feels as certain as a true one that has been similarly integrated.",
          "Consider the person who becomes vegan after watching a documentary. Within days or weeks, they have constructed a new identity around veganism. They speak with certainty about the ethics of eating animal products. But they now hold strong convictions about three technically complex domains — food ethics, environmental impact, and nutritional science — without having examined any of them independently.",
          "A woman in her late twenties is convinced she should freeze her eggs. She has read articles. She has heard friends discuss it. She has absorbed a cultural narrative. She is preparing to spend fifteen thousand dollars on a procedure she has never examined from first principles. She has not asked whether the urgency she feels is biological or cultural — whether it is her body speaking or a market speaking through her, using her fear as a vector.",
          "Borrowed certainty is everywhere. A man believes he should buy property because his parents told him renting is throwing money away. He has never run the numbers for his specific situation. The belief is inherited, not examined. But it carries the weight of certainty because it has been reinforced by every conversation he has had about money since he was a teenager.",
          "A young woman is certain her relationship is healthy because her partner has never raised his voice, never been unfaithful, never done anything she can point to as wrong. She has defined health by the absence of dramatic failure. A relationship can be non-destructive and still be diminishing. It can be faithful and still be emotionally abandoning. It can be nice and still be numb.",

          "If the answer is no — if the certainty was adopted rather than built — then the certainty is not yours, and using it to guide serious decisions is the cognitive equivalent of navigating by someone else's map without checking whether it matches the terrain.",

          "A man discovers that his wife has been confiding in a male colleague about problems in their marriage. He feels betrayed. Within hours, the feeling has become a conclusion: she has crossed a boundary. The conclusion becomes a narrative: she has been emotionally unfaithful. The narrative becomes an action: he confronts her with accusation rather than inquiry, the conversation becomes a fight, and the fight damages the relationship in ways that will take months to repair.",
          "But what actually happened? A feeling arrived. The feeling came with a built-in interpretation: you have been wronged. He did not consciously adopt this interpretation. It arrived with the feeling, already assembled. Questions that might have been asked were never asked: Is it possible that her confiding in someone else is not a violation but a signal that something in the relationship is not providing what she needs?",
          "This is the mechanism. Emotion arrives with a built-in interpretation. Anger says I have been wronged. Fear says I am in danger. Shame says I am defective. Each emotion carries a cognitive payload — a ready-made story about what is happening and what it means. Unless something interrupts the acceptance, the emotion's interpretation becomes the person's understanding of reality.",
          "The problem is not that emotions are wrong. They are sometimes right. The problem is that they are always confident and never qualified. Anger does not say I might have been wronged, pending further investigation. Emotion delivers certainty, and the mind, which craves certainty, accepts delivery without checking the contents.",

          "In the gap between emotion and analysis, most people have already formed a conclusion, and the analysis — when it arrives — is pressed into service defending the emotional verdict rather than examining it. This is called motivated reasoning, and it is more powerful than people realise.",
          "SIV's Socratic engine is designed specifically for this gap. Its purpose is to insert pressure between emotion and interpretation — to ask, before the feeling becomes a conclusion, whether the feeling is actually reporting accurately on what is happening.",

          "No important reality can be properly understood from a single angle.",
          "This is the central doctrine of SIV, and it sounds obvious until you watch how people actually behave under pressure. When a decision is needed, when something hurts, when the stakes are real, the overwhelming tendency is to find one angle that works and then stop looking. The mind has a strong preference for the simplest story that accounts for the phenomenon. Once that story is found, the mind treats the discovery of the story as the end of inquiry rather than the beginning of it.",
          "A man in his mid-forties is unhappy at work. He has been in the same role for six years. He is competent but bored. He describes the problem to himself as a career problem. He updates his resume. He talks to recruiters. He is working on the career problem. But he is examining one lens. The reality operates on several.",

          "A Vinay Lens — the unit of analysis in SIV — is a formally named, self-explanatory angle of inquiry generated specifically for the issue at hand. It is not a topic. It is not a category. It is a way of seeing that changes what becomes visible.",

          "Early conclusions function as traps. They freeze inquiry before reality has had time to disclose itself. The economist Daniel Kahneman calls this anchoring: the first number you hear becomes the gravitational centre around which all subsequent estimates orbit. The same principle operates with conclusions. An early answer becomes the default. Everything else is treated as revision rather than as a legitimate alternative.",

      const canvasRef = useRef(null);
      const nodesRef = useRef([]);
      const animationRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        if (nodesRef.current.length === 0) {
          for (let i = 0; i < 25; i++) {
            nodesRef.current.push({
              x: Math.random() * canvas.width,
              y: Math.random() * canvas.height,
              vx: (Math.random() - 0.5) * 0.3,
              vy: (Math.random() - 0.5) * 0.3,
              radius: Math.random() * 2 + 1
            });
          }
        }

        const animate = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = ColorScheme.lines;
          nodesRef.current.forEach(node => {
            node.x += node.vx;
            node.y += node.vy;
            if (node.x < 0 || node.x > canvas.width) node.vx *= -1;
            if (node.y < 0 || node.y > canvas.height) node.vy *= -1;
            ctx.beginPath();
            ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
            ctx.fill();
          });
          for (let i = 0; i < nodesRef.current.length; i++) {
            for (let j = i + 1; j < nodesRef.current.length; j++) {
              const dx = nodesRef.current[i].x - nodesRef.current[j].x;
              const dy = nodesRef.current[i].y - nodesRef.current[j].y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < 150) {
                ctx.strokeStyle = `rgba(139,105,20,${0.1 * (1 - dist / 150)})`;
                ctx.beginPath();
                ctx.moveTo(nodesRef.current[i].x, nodesRef.current[i].y);
                ctx.lineTo(nodesRef.current[j].x, nodesRef.current[j].y);
                ctx.stroke();
              }
            }
          }
          animationRef.current = requestAnimationFrame(animate);
        };

        animate();
        const handleResize = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);
        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationRef.current);
        };
      }, []);

              setIsVisible(true);
              observer.unobserve(entry.target);
            }
          },
          { threshold: 0.1 }
        );
        if (ref.current) observer.observe(ref.current);
        return () => observer.disconnect();
      }, []);

        <div

          style={{

      const currentParagraphs = paragraphs.slice(startPara, endPara);

      const goToNext = () => {
        if (currentPage < totalPages - 1) {
          setCurrentPage(currentPage + 1);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (currentChapterIndex < CHAPTERS.length - 1) {
          setCurrentChapterIndex(currentChapterIndex + 1);
          setCurrentPage(0);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };

      const goToPrev = () => {
        if (currentPage > 0) {
          setCurrentPage(currentPage - 1);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (currentChapterIndex > 0) {
          const prev = CHAPTERS[currentChapterIndex - 1];
          setCurrentChapterIndex(currentChapterIndex - 1);
          setCurrentPage(Math.max(0, Math.ceil(prev.content.length / PARA_PER_PAGE) - 1));
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };

      const handleKeydown = useCallback((e) => {
        if (e.key === 'ArrowRight') goToNext();
        if (e.key === 'ArrowLeft') goToPrev();
      }, [currentPage, currentChapterIndex]);

      useEffect(() => {
        window.addEventListener('keydown', handleKeydown);
        return () => window.removeEventListener('keydown', handleKeydown);
      }, [handleKeydown]);

      const totalParas = CHAPTERS.reduce((sum, ch) => sum + ch.content.length, 0);
      const parasBeforeCurrentChapter = CHAPTERS.slice(0, currentChapterIndex).reduce((sum, ch) => sum + ch.content.length, 0);
      const parasRead = parasBeforeCurrentChapter + Math.min((currentPage + 1) * PARA_PER_PAGE, paragraphs.length);
      const progress = (parasRead / totalParas) * 100;

      return (
        <div style={{ position: 'relative', zIndex: 1 }}>
          <div style={{
            position: 'fixed', top: 0, left: 0, right: 0,
            backgroundColor: ColorScheme.card, borderBottom: `1px solid ${ColorScheme.lines}`,
            padding: '16px 20px', display: 'flex', justifyContent: 'space-between',
            alignItems: 'center', zIndex: 100
          }}>
            <button onClick={onBack} style={{
              background: 'none', border: 'none', color: ColorScheme.accent,
              fontFamily: fonts.serif, fontSize: '14px', cursor: 'pointer', fontWeight: '600'
            }}>
              ← Home
            </button>
            <div style={{ textAlign: 'center', flex: 1, padding: '0 12px' }}>
              <div style={{ fontSize: '11px', fontFamily: fonts.system, color: ColorScheme.textLight, textTransform: 'uppercase', letterSpacing: '1px', fontWeight: '600' }}>
                {chapter.num}
              </div>
              <div style={{ fontSize: '14px', fontFamily: fonts.serif, fontWeight: '600', color: ColorScheme.text }}>
                {chapter.title}
              </div>
            </div>
            <div style={{ position: 'relative' }}>
              <button onClick={() => setShowChapterMenu(!showChapterMenu)} style={{
                background: 'none', border: 'none', color: ColorScheme.accent,
                fontFamily: fonts.serif, fontSize: '14px', cursor: 'pointer',
                display: 'flex', alignItems: 'center', gap: '4px', fontWeight: '600'
              }}>
                Chapters ▾
              </button>
              {showChapterMenu && (
                <div style={{
                  position: 'absolute', top: '100%', right: 0,
                  backgroundColor: ColorScheme.card, border: `1px solid ${ColorScheme.lines}`,
                  borderRadius: '2px', maxHeight: '400px', overflowY: 'auto',
                  zIndex: 200, minWidth: '280px', marginTop: '8px',
                  boxShadow: '0 8px 24px rgba(44,36,22,0.12)'
                }}>
                  {CHAPTERS.map((ch, i) => (
                    <button
                      key={i}
                      onClick={() => {
                        setCurrentChapterIndex(i);
                        setCurrentPage(0);
                        setShowChapterMenu(false);
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                      }}
                      style={{
                        width: '100%', padding: '12px 16px', textAlign: 'left',
                        border: 'none',
                        background: i === currentChapterIndex ? ColorScheme.accentSoft : 'transparent',
                        cursor: 'pointer', borderBottom: `1px solid ${ColorScheme.lines}`,
                        fontFamily: fonts.serif, fontSize: '13px', color: ColorScheme.text,
                        transition: 'all 0.2s ease'
                      }}
                      onMouseEnter={(e) => { if (i !== currentChapterIndex) e.target.style.backgroundColor = ColorScheme.background; }}
                      onMouseLeave={(e) => { if (i !== currentChapterIndex) e.target.style.backgroundColor = 'transparent'; }}
                    >
                      <div style={{ fontSize: '10px', color: ColorScheme.accent, marginBottom: '3px', letterSpacing: '0.8px', fontWeight: '700' }}>
                        {ch.num}
                      </div>
                      <div style={{ fontWeight: '600', lineHeight: '1.3' }}>
                        {ch.title}
                      </div>
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>

          <div style={{
            position: 'fixed', top: '70px', left: 0, right: 0, height: '2px',
            backgroundColor: ColorScheme.lines, zIndex: 99
          }}>
            <div style={{
              height: '100%', backgroundColor: ColorScheme.accent,
              width: `${progress}%`, transition: 'width 0.3s ease'
            }} />
          </div>

          <div style={{
            maxWidth: '700px', margin: '0 auto',
            padding: '100px 40px 40px 40px', minHeight: '100vh'
          }}>
            {currentPage === 0 && (
              <div style={{ marginBottom: '60px' }}>
                <div style={{ fontSize: '12px', fontFamily: fonts.system, color: ColorScheme.accent, letterSpacing: '2px', textTransform: 'uppercase', marginBottom: '16px', fontWeight: '700' }}>
                  {chapter.num}
                </div>
                <h1 style={{
                  fontSize: '44px', fontFamily: fonts.serif, fontWeight: '700',
                  color: ColorScheme.text, margin: 0, lineHeight: '1.2', letterSpacing: '-0.5px'
                }}>
                  {chapter.title}
                </h1>
                <div style={{
                  display: 'flex', alignItems: 'center', gap: '12px',
                  margin: '24px 0 0 0'
                }}>
                  <div style={{ width: '40px', height: '1px', background: ColorScheme.accent, opacity: 0.5 }} />
                  <div style={{ fontSize: '14px', color: ColorScheme.accent, fontFamily: fonts.serif }}>◆</div>
                  <div style={{ width: '40px', height: '1px', background: ColorScheme.accent, opacity: 0.5 }} />
                </div>
                <div style={{ fontSize: '13px', fontFamily: fonts.system, color: ColorScheme.textLight, marginTop: '20px', letterSpacing: '0.5px' }}>
                  {chapter.time} read
                </div>
              </div>
            )}

            <div style={{ marginBottom: '60px' }}>
              {currentParagraphs.map((para, i) => {
                const isFirstParaOfChapter = currentPage === 0 && i === 0;
                const isPullQuote = para.length < 110 && para.length > 10 && !para.endsWith(':') && !/^\d+\./.test(para);
                const isHeading = /^[A-Z][A-Z\s]+$/.test(para.trim()) && para.length < 50;
                const firstLetter = isFirstParaOfChapter && !isPullQuote && !isHeading ? para.charAt(0) : null;
                const restOfPara = isFirstParaOfChapter && !isPullQuote && !isHeading ? para.slice(1) : para;

                if (isHeading) {
                  return (
                    <h3
                      key={i}
                      style={{
                        fontSize: '14px', fontFamily: fonts.system, fontWeight: '700',
                        color: ColorScheme.accent, letterSpacing: '2px',
                        margin: '40px 0 20px 0', textTransform: 'uppercase',
                        animation: `sivFadeIn 0.5s ease ${i * 0.1}s both`
                      }}
                    >
                      {para}
                    </h3>
                  );
                }

                if (isPullQuote) {
                  return (
                    <div
                      key={i}
                      style={{
                        borderLeft: `4px solid ${ColorScheme.accent}`,
                        padding: '16px 0 16px 24px',
                        margin: '32px 0',
                        backgroundColor: ColorScheme.accentSoft,
                        paddingRight: '20px',
                        borderRadius: '0 2px 2px 0',
                        animation: `sivFadeIn 0.5s ease ${i * 0.15}s both`
                      }}
                    >
                      <p style={{
                        fontSize: '20px', fontFamily: fonts.serif, fontWeight: '600',
                        color: ColorScheme.text, lineHeight: '1.5', margin: 0, fontStyle: 'italic'
                      }}>
                        {para}
                      </p>
                    </div>
                  );
                }

                return (
                  <p
                    key={i}
                    style={{
                      fontSize: '17px', fontFamily: fonts.serif, color: ColorScheme.text,
                      lineHeight: '1.85', margin: 0, paddingBottom: '24px',
                      animation: `sivFadeIn 0.5s ease ${i * 0.15}s both`
                    }}
                  >
                    {isFirstParaOfChapter && firstLetter && (
                      <span style={{
                        float: 'left', fontSize: '64px', lineHeight: '50px',
                        fontWeight: '700', color: ColorScheme.accent, fontFamily: fonts.serif,
                        marginRight: '8px', marginTop: '6px'
                      }}>
                        {firstLetter}
                      </span>
                    )}
                    {isFirstParaOfChapter && firstLetter ? restOfPara : para}
                  </p>
                );
              })}
            </div>

            <div style={{
              display: 'flex', justifyContent: 'space-between', alignItems: 'center',
              padding: '30px 0', borderTop: `1px solid ${ColorScheme.lines}`, gap: '16px', flexWrap: 'wrap'
            }}>
              <button onClick={goToPrev} disabled={currentChapterIndex === 0 && currentPage === 0} style={{
                padding: '10px 20px', backgroundColor: ColorScheme.accentSoft, color: ColorScheme.text,
                border: 'none', borderRadius: '2px', fontFamily: fonts.serif, fontSize: '14px',
                cursor: currentChapterIndex === 0 && currentPage === 0 ? 'not-allowed' : 'pointer',
                display: 'flex', alignItems: 'center', gap: '8px',
                opacity: currentChapterIndex === 0 && currentPage === 0 ? 0.3 : 1,
                transition: 'all 0.3s ease'
              }}
              onMouseEnter={(e) => { if (!(currentChapterIndex === 0 && currentPage === 0)) { e.target.style.backgroundColor = ColorScheme.accent; e.target.style.color = ColorScheme.card; } }}
              onMouseLeave={(e) => { e.target.style.backgroundColor = ColorScheme.accentSoft; e.target.style.color = ColorScheme.text; }}
              >
                ← Previous
              </button>

              <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', justifyContent: 'center' }}>
                {Array.from({ length: totalPages }).map((_, i) => (
                  <button
                    key={i}
                    onClick={() => { setCurrentPage(i); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                    style={{
                      width: '8px', height: '8px', borderRadius: '50%',
                      backgroundColor: i === currentPage ? ColorScheme.accent : ColorScheme.lines,
                      border: 'none', cursor: 'pointer', transition: 'all 0.3s ease', padding: 0
                    }}
                  />
                ))}
              </div>

              <button onClick={goToNext} disabled={currentChapterIndex === CHAPTERS.length - 1 && currentPage === totalPages - 1} style={{
                padding: '10px 20px', backgroundColor: ColorScheme.accentSoft, color: ColorScheme.text,
                border: 'none', borderRadius: '2px', fontFamily: fonts.serif, fontSize: '14px',
                cursor: currentChapterIndex === CHAPTERS.length - 1 && currentPage === totalPages - 1 ? 'not-allowed' : 'pointer',
                display: 'flex', alignItems: 'center', gap: '8px',
                opacity: currentChapterIndex === CHAPTERS.length - 1 && currentPage === totalPages - 1 ? 0.3 : 1,
                transition: 'all 0.3s ease'
              }}
              onMouseEnter={(e) => { if (!(currentChapterIndex === CHAPTERS.length - 1 && currentPage === totalPages - 1)) { e.target.style.backgroundColor = ColorScheme.accent; e.target.style.color = ColorScheme.card; } }}
              onMouseLeave={(e) => { e.target.style.backgroundColor = ColorScheme.accentSoft; e.target.style.color = ColorScheme.text; }}
              >
                Next →
              </button>
            </div>
          </div>
        </div>
      );
    };

    const TopNav = ({ mode, onNavigate }) => {
      if (mode !== 'home') return null;
      return (
        <div style={{
          position: 'fixed', top: 0, left: 0, right: 0,
          backgroundColor: ColorScheme.card, borderBottom: `1px solid ${ColorScheme.lines}`,
          padding: '16px 40px', display: 'flex', justifyContent: 'space-between',
          alignItems: 'center', zIndex: 50
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
            <a href="siv-method-book.html" style={{
              color: ColorScheme.textMedium, textDecoration: 'none',
              fontFamily: fonts.serif, fontSize: '13px', fontWeight: '500',
              marginRight: '6px'
            }}>← Site</a>
            <div style={{
              width: '32px', height: '32px', borderRadius: '50%',
              background: `linear-gradient(135deg, ${ColorScheme.accentLight}, ${ColorScheme.accent})`,
              display: 'flex', alignItems: 'center', justifyContent: 'center'
            }}>
              <span style={{ fontSize: '14px', fontFamily: fonts.serif, fontWeight: '700', color: ColorScheme.card, letterSpacing: '-0.5px' }}>SIV</span>
            </div>
            <div style={{ fontSize: '14px', fontFamily: fonts.serif, fontWeight: '600', color: ColorScheme.text }}>
              The SIV Method
            </div>
          </div>
          <div style={{ display: 'flex', gap: '30px', fontSize: '14px', fontFamily: fonts.serif }}>
            <button onClick={() => onNavigate('home')} style={{
              background: 'none', border: 'none', color: ColorScheme.text,
              cursor: 'pointer', fontWeight: '500', transition: 'color 0.3s ease'
            }}
            onMouseEnter={(e) => { e.target.style.color = ColorScheme.accent; }}
            onMouseLeave={(e) => { e.target.style.color = ColorScheme.text; }}
            >
              Home
            </button>
            <button onClick={() => onNavigate('read')} style={{
              background: 'none', border: 'none', color: ColorScheme.accent,
              cursor: 'pointer', fontWeight: '600'
            }}>
              Read
            </button>
          </div>
        </div>
      );
    };

    function SivApp() {
      const [mode, setMode] = useState('home');
      const [startChapter, setStartChapter] = useState(0);

      const handleStartReading = (chapterIndex) => {
        setStartChapter(typeof chapterIndex === 'number' ? chapterIndex : 0);
        setMode('read');
      };

      useEffect(() => {
        const loader = document.getElementById('siv-loading');
        if (loader) loader.remove();
        const link = document.getElementById('back-to-site');
        if (link) link.style.display = mode === 'read' ? 'block' : 'none';
      }, [mode]);

      return (
        <div style={{
          backgroundColor: ColorScheme.background, color: ColorScheme.text,
          fontFamily: fonts.serif, minHeight: '100vh'
        }}>
          <StyleInjector />
          <NetworkBackground />
          <TopNav mode={mode} onNavigate={setMode} />
          {mode === 'home' ? (
            <HomePage onStartReading={handleStartReading} />
          ) : (
            <ReaderPage onBack={() => setMode('home')} initialChapter={startChapter} />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SivApp />);
  </script>
</body>
</html>
