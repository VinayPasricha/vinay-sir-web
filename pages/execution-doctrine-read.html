  <script type="text/babel" data-presets="react">

      {
        num: 'PREFACE',
        title: 'The Spirit of the Doctrine',
        time: '8 min',
        content: [
          "Execution is among the most consequential force multipliers in professional and personal life.",
          "It is the bridge between intention and reality, between strategic vision and tangible result, between possibility and built form. Every meaningful enterprise — whether a corporation, a product, a personal transformation, a body of work, or a long-term mission — rises or falls on the caliber of execution behind it. Ideas matter. Strategy matters. Talent matters. But ultimately, the world is shaped by what is actually executed.",
          "Over time, one truth becomes impossible to ignore: execution is not merely a function of effort. It is not reducible to discipline, intensity, speed, sincerity, or the willingness to work harder than the next person. These attributes have value, and no serious builder dismisses them. But they are not the highest form of execution. They are the raw materials from which higher execution can be constructed.",
          "The highest form of execution is mastery.",
          "Mastery in execution is not loud. It is not theatrical. It does not depend on permanent strain. It emerges from seeing the work clearly, structuring it properly, diagnosing what truly constrains it, and strengthening that point with precision. Over time, this produces something rare: a system of action that becomes progressively stronger, more efficient, more reliable, and more powerful — without depending solely on brute force.",
          "That is the spirit behind Vinay's Execution Doctrine.",
          "This doctrine is built on a simple but powerful insight: every process, every team, every system, and every mission has a current limiting factor. The output of the whole is shaped not by the parts that are already strong, but by the point where weakness, friction, delay, distortion, or fragility still governs the flow. A serious executor learns to look there first. A master executor learns to strengthen that point repeatedly until the capacity of the whole begins to rise.",
          "This is why execution, at its best, becomes a disciplined craft.",
          "A weak operator responds to difficulty by pushing harder everywhere. A competent operator improves organization and follow-through. A master operator identifies the governing constraint and improves the system where it matters most.",
          "Seen this way, execution transcends task completion. It becomes the disciplined art of building stronger pathways from intention to outcome — a method of converting work into flow, complexity into sequence, friction into learning, and repeated cycles into expanded capacity.",
          "Vinay's Execution Doctrine is designed to formalize that mastery.",
          "It is not a rejection of discipline. It is a refinement of discipline. It is not a rejection of hard work. It is a superior deployment of hard work. It is not a rejection of standard execution cycles. It is a governing logic for systematically improving them.",
          "The doctrine operates on top of the standard PDCA loop — Plan, Do, Check, Act. Every process must first be clearly defined as a sequence of actions, from Action 1 to Action N. The work is then executed. In the Check stage, the current limiting factor is identified through repeated friction, delay, failure, or output loss. In the Act stage, the next cycle is redesigned so that this limiting factor is specifically strengthened. The loop then runs again — at a higher level of intelligence and, if the doctrine is being applied properly, at a higher level of capacity.",
          "This repeated strengthening of the live bottleneck is what this doctrine calls the Capacity Expansion Engine.",
          "Its purpose is to transform execution from something driven primarily by effort into something governed by method, refinement, and structural improvement. Over time, the executor is no longer merely working harder. He is building a system that can carry more, move better, produce more reliably, and improve continuously. This is where execution ceases to be crude labor and begins to approach mastery.",
          "This doctrine is designed to be universal.",
          "It can be applied by an individual seeking to improve health, learning, output, habits, or discipline. It can be deployed by a team striving to hit targets with greater consistency. It can be adopted by a company seeking to improve sales, hiring, delivery, recruiting, operations, or capital efficiency. It can govern any long-horizon mission where the path from idea to result must be strengthened over time. The domain may change. The underlying logic does not.",
          "This doctrine is also deliberately separate from SIV.",
          "SIV — Socratic Iterative Vinay — is an inquiry method. It exists to create clarity, stress-test assumptions, dismantle weak reasoning, and sharpen understanding. Vinay's Execution Doctrine begins after that work is done. Once understanding has been achieved, this doctrine governs how action is structured, measured, corrected, and improved in the real world.",
          "The distinction matters.",
          "SIV is for seeing clearly. Vinay's Execution Doctrine is for building effectively. One governs the quality of understanding. The other governs the quality of execution.",
          "Together, they form a complete arc: clear thought followed by strengthened action.",
          "This document is written for builders, operators, founders, leaders, and individuals who intend to execute seriously over long periods of time. It is written for those who understand that real progress does not come from noise, motion, or management theatre, but from the disciplined strengthening of the path through which outcomes are produced.",
          "The doctrine is interested in output — not crude output in isolation, but output relative to time, quality, stability, and resource expenditure. That is the true expression of expanded capacity. A result delivered slowly, unreliably, or wastefully is not yet strong execution. Strong execution produces results with increasing power, precision, and repeatability.",
          "To operate this way requires a fundamental change in posture.",
          "Do not ask only whether the team worked hard. Ask what most limited output. Do not ask only whether the plan was sincere. Ask where the sequence leaked, slowed, broke, or weakened. Do not ask only whether a cycle was completed. Ask whether the system became stronger.",
          "That is the posture of the master executor.",
          "The ambition of this doctrine is not merely to help people get more things done. Its ambition is to help them build execution as a serious discipline of mastery — one in which the path of action is continuously improved, the limiting factor is repeatedly strengthened, and capacity expands over time.",
          "That is how execution becomes a source not only of results, but of power, elegance, confidence, and enduring competitive advantage."
        ]

          "The gap between intention and reality is where execution lives.",
          "That gap is universal. Every person has plans that remain unexecuted. Every organization has strategies that do not translate into results. Every mission has a vision that exceeds its delivery. The distance between what is intended and what is delivered is not a flaw in human nature. It is the fundamental condition that execution must bridge.",
          "Bridging that gap is not trivial.",
          "Most people respond to execution difficulty with increased pressure. When results fall short, the response is typically to work longer hours, demand greater effort, push harder, maintain higher intensity, and accept more sacrifice. This may produce motion. But motion is not the same as execution. And increased effort is not the same as increased capacity.",
          "That distinction is crucial.",
          "True execution is not measured by effort expended. It is measured by results produced relative to resources consumed, time elapsed, reliability demanded, and quality required. A system that produces better results using the same resources, in less time, with greater consistency, and at higher quality is executing more powerfully. A system that merely produces the same results through greater strain, longer hours, and higher sacrifice is not executing more effectively. It is merely working harder.",

          "This shift from effort-based execution to constraint-based execution is what separates mastery from mere labor.",

          "This foundation has several implications.",
          "First, it means that not all parts of a system are equally important for improvement. The weak link in a chain governs the strength of the whole chain. Improving an already-strong element may have psychological value, but it produces minimal improvement in system output. Improving the weakest element produces proportional improvement in system capacity.",
          "Second, it means that execution is not primarily about effort. A system can become stronger through improved design, better tools, clearer information, more appropriate resources, or corrected sequence — without necessarily demanding more human effort. In fact, the sign of mature execution is that systems become more powerful while demanding less strain.",
          "Third, it means that execution is cyclical. A single cycle of action and improvement is never sufficient. The constraint that limits output in cycle N is typically not the same constraint that will limit output in cycle N+1. As the first constraint is strengthened, a new limiting factor emerges. A serious executor expects this and has a system for identifying and addressing each new constraint.",
          "Fourth, it means that execution is measurable. Capacity either expands or it does not. Output either improves or it stagnates. The doctrine cares deeply about whether the system actually becomes stronger. Intention, effort, and activity are secondary to whether the real limiting factor was identified and whether the next cycle was actually improved.",

          "It is designed for serious operators: founders, leaders, operators, builders, and individuals committed to excellence over long periods of time. It is written for those who understand that real progress comes not from motion or effort or sincere intention, but from the disciplined identification and strengthening of the actual limiting factors that govern performance."

          "Every system that produces output has a current limiting factor. This is not a philosophical claim. It is an observable reality.",
          "Imagine a sales organization. The elements include salespeople, marketing materials, prospecting methods, sales training, pricing, product quality, customer support, and payment processing. If sales are below potential, the shortfall is not due to all elements being equally weak. It is due to one or a small number of specific elements being weaker than the others and thus governing overall output.",
          "Perhaps the limiting factor is inadequate prospecting, which means the sales team has insufficient leads to work with. Perhaps it is poor sales training, which means the team lacks the skill to close effectively. Perhaps it is inadequate pricing power, which makes the offering uncompetitive. Perhaps it is slow payment processing, which creates friction in the customer journey. One of these — or some other specific element — is more consequential than the others in determining whether sales rise or remain flat.",
          "The same principle applies everywhere.",
          "In a manufacturing process, output is limited by the slowest station on the production line, the availability of raw materials, the capacity of the shipping department, or the reliability of a key machine. In an athletic performance, a runner's speed is limited by cardiovascular capacity, leg strength, running economy, or mental discipline — whichever is weakest. In a research program, progress is limited by funding, talent, equipment, focus, or institutional support. In a team's ability to deliver a product, development is limited by technical capability, design clarity, decision-making speed, testing infrastructure, or resource allocation.",
          "There is always a current limiting factor.",
          "This is sometimes called the Theory of Constraints, the Goldratt principle, or the idea of the weakest link. But the specific name is less important than the underlying reality. In any system producing output, there is at least one element whose weakness disproportionately constrains the output of the whole. That element is the governing limit.",
          "The strength of Vinay's Execution Doctrine depends on the executor's ability to identify this limit accurately.",
          "Misidentifying the constraint leads to wasted effort. If a sales shortfall is actually due to poor prospecting but the organization focuses on sales training, then sales training will improve while sales remain flat. If a manufacturing bottleneck is actually at the shipping department but production focuses on equipment speed, then equipment runs faster while the shipping backlog grows. If an athlete's speed is limited by cardiovascular capacity but training focuses on strength, then strength improves while speed remains unchanged.",
          "The executor who misidentifies the constraint works hard in the wrong place.",
          "An executor who correctly identifies the constraint and focuses improvement effort there produces disproportionate returns. The sales organization that identifies poor prospecting as the constraint and builds a prospecting system produces rapid sales growth. The manufacturer that identifies the shipping department as the bottleneck and expands shipping capacity increases output immediately. The athlete who identifies cardiovascular capacity as the limit and trains aerobic systems improves speed markedly.",
          "Right effort in the right place produces visible results.",
          "But identifying the true limiting factor is not always obvious. Organizations often mistake the loudest problem for the real problem. They mistake the most visible element for the most consequential element. They focus on what is already known to be weak rather than identifying what is truly governing output. This is why the doctrine places such emphasis on the discipline of accurate constraint identification.",

          "Serious diagnosis requires looking past surface problems to the structural or systemic factors that actually govern output.",
          "Once the governing limit is identified, the entire focus of the execution cycle shifts. No longer is effort distributed across multiple improvements. No longer is the organization trying to improve everything at once. Instead, all improvement energy is concentrated on strengthening that one specific constraint. When this constraint has been adequately strengthened, output rises. Then, the executor identifies the next limiting factor and begins again.",

        title: 'The Capacity Expansion Engine',
        time: '18 min',
        content: [
          "The Capacity Expansion Engine is the repeating cycle through which systems become progressively stronger.",
          "It is built on top of the standard Plan-Do-Check-Act (PDCA) cycle. The PDCA cycle is a proven framework for continuous improvement. But the Capacity Expansion Engine refines the PDCA cycle with a specific discipline: in each cycle, the current governing constraint is identified and strengthened.",
          "The cycle operates as follows:",
          "First, PLAN. The execution sequence is clearly defined. Every step from Action 1 to Action N is articulated. The desired output is specified. The success criteria are established. The timeline is set. The responsibilities are assigned. This is not casual planning. It is formal, written, and sufficiently detailed that someone unfamiliar with the work could understand what is supposed to happen.",
          "Second, DO. The plan is executed. Work proceeds according to the defined sequence. The executor does what was planned. This is not where improvement happens. This is where the current system's limitations become visible. Friction appears. Delays occur. Bottlenecks manifest. Failures surface. This is the stage where the system reveals what is actually limiting its output.",
          "Third, CHECK. The execution is analyzed. What was supposed to happen is compared to what actually happened. Output is measured against the intended outcome. Delays are identified. Failures are examined. But crucially, in this doctrine, the Check stage includes a specific discipline: identifying the current limiting factor. What element of the system most prevented full and timely output? Where did friction accumulate? Where did the process slow, break, or fail? That is the governing constraint.",
          "Fourth, ACT. The plan is revised for the next cycle. Specifically, the design of the next cycle is modified so that the identified constraint is strengthened. If the constraint was a skill deficiency, training is added. If it was a process step that was too slow, that step is redesigned. If it was inadequate information, information systems are improved. If it was a resource shortage, resources are reallocated. The constraint is not ignored. It is specifically addressed.",
          "Then the cycle repeats.",
          "In the second cycle, the plan is executed at a higher level of strength because the previous constraint has been addressed. New output is produced. In the Check stage, a new limiting factor may emerge — perhaps something that was not visible as a constraint in cycle 1 because an earlier constraint masked it. This new constraint is identified. In the Act stage, the plan for cycle 3 is modified to strengthen this new constraint. The cycle continues.",
          "Over time, this produces something remarkable.",
          "With each cycle, the system becomes stronger. Not through general effort or broad improvement, but through targeted strengthening of specific constraints. The output in cycle 5 is higher than in cycle 1, not because everyone is working harder, but because the system itself has been progressively refined. Friction has been reduced. Bottlenecks have been opened. The path from intention to outcome has been clarified. The system has expanded its capacity.",
          "This is the Capacity Expansion Engine.",
          "It is called an 'engine' because, once established, it becomes self-perpetuating. Each cycle produces learning about what constrains output. Each Act stage incorporates that learning into the next cycle. The system becomes progressively more intelligent about its own limitations and progressively more capable of addressing them. Over time, a well-run system under this discipline becomes measurably stronger and more reliable than a system driven by effort alone.",
          "Several principles govern the engine.",
          "First, the discipline of one constraint. In any given cycle, the primary focus is on strengthening the current governing constraint. This does not mean ignoring all other problems. But it means that primary improvement effort is concentrated on the point that most limits output. This focus produces better returns than diffuse effort.",
          "Second, the clarity of the sequence. Every execution cycle begins with a clear definition of the intended action sequence, from Action 1 to Action N. Without this clarity, it is impossible to identify where the sequence fails or where constraints emerge. Vagueness about the work leads to vagueness about improvement.",

          "Fourth, the specificity of the Act stage. When a constraint is addressed, the improvement must be specific to that constraint. Vague improvements or broad initiatives produce vague results. Targeted improvements produce visible capacity gains.",
          "The Capacity Expansion Engine is not automatic.",
          "It requires discipline, honest diagnosis, willingness to focus effort, and commitment to structural improvement over mere activity. Many organizations run PDCA cycles that are missing one or more of these elements. They plan and do and check and act, but they do not focus the Act stage on the specific constraint, so the system does not demonstrably strengthen. The engine must be operated deliberately.",
          "But for those who run it with discipline, the results compound.",
          "Year 1 of operation under this discipline produces modest improvement. Year 2 produces more substantial improvement as the system becomes smarter about its own constraints. Year 3 produces marked improvement as the path from intention to outcome has been substantially clarified. By Year 5, the system is operating at a level of capacity and reliability that would be unrecognizable to the operator from Year 1.",

          "Every execution system operates as a loop.",
          "The loop begins with intention. There is something that needs to be accomplished. A product needs to be built. A customer needs to be acquired. A decision needs to be made. A health goal needs to be met. Revenue needs to be generated. The intention is clear. But intention alone produces no output.",
          "From intention flows action.",
          "The intended outcome is pursued through a series of actions. These actions are not random. They are organized in a sequence. Action 1 must happen before Action 2. Step A must be completed before Step B can begin. The progression has an order. This is what the doctrine calls the defined action sequence, or the 'sequence from Action 1 to Action N.'",
          "Following a sequence is not trivial.",
          "A sequence can be poorly defined, leading to confusion about what should happen and when. A sequence can have missing steps, so the work never actually reaches completion. A sequence can have steps that are in the wrong order, so progress is blocked. A sequence can have unclear handoffs, so work gets lost between steps. A sequence can have steps that are slower or weaker than necessary, creating bottlenecks. The clarity and strength of the sequence directly impact whether the intended outcome is reliably achieved.",
          "Execution means running the sequence.",
          "The work proceeds from Action 1 through all intermediate steps to Action N, following the defined sequence. During this execution, the real system reveals itself. What was planned in theory meets reality. Friction emerges. People hit obstacles. Information is incomplete. Resources are insufficient. Decisions must be made. The ideal sequence encounters the constraints of the actual world.",
          "This is where most execution systems falter.",

          "That is the moment of truth.",
          "The answer to that question determines whether the system is executing or merely producing activity. A sequence that generates activity but not reliable output is not a system of execution. It is a system of motion. Real execution means the intended outcome is reliably produced, cycle after cycle.",

          "The base loop is the foundation: intention, sequence, execution, output, repetition. The Capacity Expansion Engine is the intelligence added on top: identification of the governing constraint, systematic strengthening of that constraint, and a sequence that becomes progressively more powerful.",

          "The defined action sequence is the foundation of everything the doctrine does.",
          "Without a clear sequence, there is no execution. There is only activity. People work, but without coherent direction. Effort is expended, but it is not organized toward a reliable outcome. Resources are consumed, but without a clear purpose or progression.",
          "The defined action sequence changes that.",
          "A sequence is a progression of steps from an initial state to a desired outcome. It has a clear beginning (Action 1), a series of intermediate actions (Action 2, Action 3, Action N-1), and a clear end (Action N, the completion point). Each step must be completed adequately before the next step begins. The order matters. Skipping ahead creates problems. Returning to earlier steps wastes effort.",

    const NetworkBackground = () => {
      const canvasRef = useRef(null);
      const nodesRef = useRef([]);
      const animationRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        if (nodesRef.current.length === 0) {
          for (let i = 0; i < 25; i++) {
            nodesRef.current.push({
              x: Math.random() * canvas.width,
              y: Math.random() * canvas.height,
              vx: (Math.random() - 0.5) * 0.3,
              vy: (Math.random() - 0.5) * 0.3,
              radius: Math.random() * 2 + 1
            });
          }
        }

        const animate = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = ColorScheme.lines;
          ctx.strokeStyle = ColorScheme.lines;

          nodesRef.current.forEach(node => {
            node.x += node.vx;
            node.y += node.vy;
            if (node.x < 0 || node.x > canvas.width) node.vx *= -1;
            if (node.y < 0 || node.y > canvas.height) node.vy *= -1;
            ctx.beginPath();
            ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
            ctx.fill();
          });

          for (let i = 0; i < nodesRef.current.length; i++) {
            for (let j = i + 1; j < nodesRef.current.length; j++) {
              const dx = nodesRef.current[i].x - nodesRef.current[j].x;
              const dy = nodesRef.current[i].y - nodesRef.current[j].y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < 150) {
                ctx.strokeStyle = `rgba(139,105,20,${0.1 * (1 - dist / 150)})`;
                ctx.beginPath();
                ctx.moveTo(nodesRef.current[i].x, nodesRef.current[i].y);
                ctx.lineTo(nodesRef.current[j].x, nodesRef.current[j].y);
                ctx.stroke();
              }
            }
          }

          animationRef.current = requestAnimationFrame(animate);
        };

        animate();

        const handleResize = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };

        window.addEventListener('resize', handleResize);
        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationRef.current);
        };
      }, []);

      return <canvas ref={canvasRef} style={{ position: 'fixed', top: 0, left: 0, zIndex: 0, opacity: 0.5, pointerEvents: 'none' }} />;
    };

            if (entry.isIntersecting) {

              observer.unobserve(entry.target);

          { threshold: 0.1 }

        if (ref.current) observer.observe(ref.current);
        return () => observer.disconnect();
      }, []);

          ref={ref}
          style={{

              <h2 style={{ fontSize: '36px', fontFamily: fonts.serif, fontWeight: '600', color: ColorScheme.text, marginBottom: '60px', textAlign: 'center' }}>
                Three Core Claims
              </h2>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '40px', maxWidth: '1000px', margin: '0 auto' }}>
                {[
                  'Every execution path has a governing limit.',
                  'Output improves most when the governing limit is strengthened.',
                  'Execution becomes mastery when each cycle leaves the system stronger.'
                ].map((claim, i) => (
                  <div key={i} style={{
                    padding: '40px', backgroundColor: ColorScheme.background,
                    borderLeft: `4px solid ${ColorScheme.accent}`, borderRadius: '2px'
                  }}>
                    <p style={{ fontSize: '18px', fontFamily: fonts.serif, color: ColorScheme.text, lineHeight: '1.6', margin: 0 }}>
                      {claim}
                    </p>
                  </div>
                ))}
              </div>
            </FadeInSection>
          </section>

          <section style={{ padding: '80px 40px', backgroundColor: ColorScheme.background }}>
            <FadeInSection>
              <h2 style={{ fontSize: '36px', fontFamily: fonts.serif, fontWeight: '600', color: ColorScheme.text, marginBottom: '60px', textAlign: 'center' }}>
                The PDCA Loop
              </h2>
              <div style={{ maxWidth: '500px', margin: '0 auto' }}>
                <PDCADiagram />
              </div>
              <p style={{ fontSize: '14px', fontFamily: fonts.serif, color: ColorScheme.textLight, textAlign: 'center', marginTop: '40px' }}>
                Plan → Do → Check (Identify the constraint) → Act (Strengthen the next cycle) → Repeat
              </p>
            </FadeInSection>
          </section>

          <section id="engine-section" style={{ padding: '80px 40px', backgroundColor: ColorScheme.card }}>
            <FadeInSection>
              <h2 style={{ fontSize: '36px', fontFamily: fonts.serif, fontWeight: '600', color: ColorScheme.text, marginBottom: '60px', textAlign: 'center' }}>
                Bottleneck Classes
              </h2>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '40px', maxWidth: '1000px', margin: '0 auto' }}>
                <div>
                  <h3 style={{ fontSize: '20px', fontFamily: fonts.serif, fontWeight: '600', color: ColorScheme.accent, marginBottom: '20px' }}>
                    Human Bottlenecks
                  </h3>
                  {['Skill Deficiency', 'Role Mismatch', 'Unclear Instruction', 'Misaligned Incentive', 'Discipline Failure'].map((item, i) => (
                    <div key={i} style={{
                      padding: '12px 16px', backgroundColor: ColorScheme.background,
                      marginBottom: '10px', borderRadius: '2px', fontSize: '14px',
                      fontFamily: fonts.serif, color: ColorScheme.text
                    }}>
                      {item}
                    </div>
                  ))}
                </div>
                <div>
                  <h3 style={{ fontSize: '20px', fontFamily: fonts.serif, fontWeight: '600', color: ColorScheme.accent, marginBottom: '20px' }}>
                    Structural Bottlenecks
                  </h3>
                  {['Process', 'Tool', 'Information', 'Resource', 'Sequence', 'Decision Quality'].map((item, i) => (
                    <div key={i} style={{
                      padding: '12px 16px', backgroundColor: ColorScheme.background,
                      marginBottom: '10px', borderRadius: '2px', fontSize: '14px',
                      fontFamily: fonts.serif, color: ColorScheme.text
                    }}>
                      {item}
                    </div>
                  ))}
                </div>
              </div>
            </FadeInSection>
          </section>

          <section style={{ padding: '80px 40px', backgroundColor: ColorScheme.background }}>
            <FadeInSection>
              <div style={{ maxWidth: '700px', margin: '0 auto' }}>
                <h2 style={{ fontSize: '36px', fontFamily: fonts.serif, fontWeight: '600', color: ColorScheme.text, marginBottom: '30px', textAlign: 'center' }}>
                  Why This Matters
                </h2>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '20px' }}>
                  {['Stronger teams', 'Cleaner operating systems', 'Better decision execution', 'Less dependence on heroics', 'More reliable output', 'Scalable capacity'].map((item, i) => (
                    <div key={i} style={{
                      padding: '20px', backgroundColor: ColorScheme.accentSoft,
                      borderRadius: '2px', textAlign: 'center', fontSize: '14px',
                      fontFamily: fonts.serif, color: ColorScheme.text, fontWeight: '500'
                    }}>
                      {item}
                    </div>
                  ))}
                </div>
              </div>
            </FadeInSection>
          </section>

          <section style={{ padding: '80px 40px', backgroundColor: ColorScheme.card }}>
            <FadeInSection>
              <h2 style={{ fontSize: '36px', fontFamily: fonts.serif, fontWeight: '600', color: ColorScheme.text, marginBottom: '60px', textAlign: 'center' }}>
                Chapter Map
              </h2>
              <div style={{ maxWidth: '1000px', margin: '0 auto', display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(250px, 1fr))', gap: '20px' }}>
                {CHAPTERS.map((ch, i) => (
                  <button
                    key={i}
                    onClick={() => onStartReading(i)}
                    style={{
                      padding: '20px', backgroundColor: ColorScheme.background,
                      border: `1px solid ${ColorScheme.lines}`, borderRadius: '2px',
                      cursor: 'pointer', textAlign: 'left', transition: 'all 0.3s ease'
                    }}
                    onMouseEnter={(e) => {
                      e.currentTarget.style.backgroundColor = ColorScheme.accentSoft;
                      e.currentTarget.style.borderColor = ColorScheme.accent;
                    }}
                    onMouseLeave={(e) => {
                      e.currentTarget.style.backgroundColor = ColorScheme.background;
                      e.currentTarget.style.borderColor = ColorScheme.lines;
                    }}
                  >
                    <div style={{ fontSize: '12px', fontFamily: fonts.system, color: ColorScheme.textLight, letterSpacing: '0.5px', textTransform: 'uppercase', marginBottom: '4px' }}>
                      {ch.num}
                    </div>
                    <div style={{ fontSize: '16px', fontFamily: fonts.serif, fontWeight: '600', color: ColorScheme.text, marginBottom: '8px' }}>
                      {ch.title}
                    </div>
                    <div style={{ fontSize: '12px', fontFamily: fonts.system, color: ColorScheme.textLight }}>
                      {ch.time}
                    </div>
                  </button>
                ))}
              </div>
            </FadeInSection>
          </section>

          <section style={{ padding: '80px 40px', backgroundColor: ColorScheme.background }}>
            <FadeInSection>
              <div style={{ maxWidth: '700px', margin: '0 auto', textAlign: 'center' }}>
                <p style={{ fontSize: '20px', fontFamily: fonts.serif, color: ColorScheme.text, lineHeight: '1.8', marginBottom: '40px' }}>
                  This doctrine is for builders who want execution to become stronger as a system — cleaner, sharper, more reliable, and less dependent on brute force.
                </p>
                <button onClick={() => onStartReading(0)} style={{
                  padding: '14px 40px', backgroundColor: ColorScheme.accent, color: ColorScheme.card,
                  border: 'none', borderRadius: '2px', fontFamily: fonts.serif, fontSize: '16px',
                  fontWeight: '600', cursor: 'pointer', transition: 'all 0.3s ease', letterSpacing: '0.5px'
                }}
                onMouseEnter={(e) => { e.target.style.backgroundColor = ColorScheme.accentLight; }}
                onMouseLeave={(e) => { e.target.style.backgroundColor = ColorScheme.accent; }}
                >
                  Begin Reading
                </button>
              </div>
            </FadeInSection>
          </section>

          <section style={{ padding: '40px 20px', backgroundColor: ColorScheme.accent, textAlign: 'center', borderTop: `1px solid ${ColorScheme.lines}` }}>
            <p style={{ fontSize: '14px', fontFamily: fonts.serif, color: ColorScheme.card, margin: '0 0 8px 0' }}>
              Vinay's Execution Doctrine · The Capacity Expansion Engine
            </p>
            <p style={{ fontSize: '12px', fontFamily: fonts.system, color: ColorScheme.card, opacity: 0.8, margin: 0 }}>
              A universal system for strengthening execution and expanding capacity
            </p>
          </section>
        </div>
      );
    };

    const ReaderPage = ({ onBack, initialChapter = 0 }) => {
      const [currentChapterIndex, setCurrentChapterIndex] = useState(initialChapter);
      const [currentPage, setCurrentPage] = useState(0);
      const [showChapterMenu, setShowChapterMenu] = useState(false);

      const chapter = CHAPTERS[currentChapterIndex];
      const paragraphs = chapter.content;

      useEffect(() => {
        if (window.trackEvent) {
          window.trackEvent('chapter_started', {
            book: 'execution_doctrine',
            chapter_num: chapter.num,
            chapter_title: chapter.title,
            chapter_index: currentChapterIndex
          });
        }
      }, [currentChapterIndex]);

      const PARA_PER_PAGE = 4;
      const totalPages = Math.ceil(paragraphs.length / PARA_PER_PAGE);
      const startPara = currentPage * PARA_PER_PAGE;
      const endPara = Math.min(startPara + PARA_PER_PAGE, paragraphs.length);
      const currentParagraphs = paragraphs.slice(startPara, endPara);

      const goToNext = () => {
        if (currentPage < totalPages - 1) {
          setCurrentPage(currentPage + 1);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (currentChapterIndex < CHAPTERS.length - 1) {
          setCurrentChapterIndex(currentChapterIndex + 1);
          setCurrentPage(0);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };

      const goToPrev = () => {
        if (currentPage > 0) {
          setCurrentPage(currentPage - 1);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (currentChapterIndex > 0) {
          const prev = CHAPTERS[currentChapterIndex - 1];
          setCurrentChapterIndex(currentChapterIndex - 1);
          setCurrentPage(Math.ceil(prev.content.length / PARA_PER_PAGE) - 1);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };

      const handleKeydown = useCallback((e) => {
        if (e.key === 'ArrowRight') goToNext();
        if (e.key === 'ArrowLeft') goToPrev();
      }, [currentPage, currentChapterIndex]);

      useEffect(() => {
        window.addEventListener('keydown', handleKeydown);
        return () => window.removeEventListener('keydown', handleKeydown);
      }, [handleKeydown]);

      const totalParas = CHAPTERS.reduce((sum, ch) => sum + ch.content.length, 0);
      const parasBeforeCurrentChapter = CHAPTERS.slice(0, currentChapterIndex).reduce((sum, ch) => sum + ch.content.length, 0);
      const parasRead = parasBeforeCurrentChapter + Math.min((currentPage + 1) * PARA_PER_PAGE, paragraphs.length);
      const progress = (parasRead / totalParas) * 100;

      return (
        <div style={{ position: 'relative', zIndex: 1 }}>
          <div style={{
            position: 'fixed', top: 0, left: 0, right: 0,
            backgroundColor: ColorScheme.card, borderBottom: `1px solid ${ColorScheme.lines}`,
            padding: '16px 20px', display: 'flex', justifyContent: 'space-between',
            alignItems: 'center', zIndex: 100
          }}>
            <button onClick={onBack} style={{
              background: 'none', border: 'none', color: ColorScheme.accent,
              fontFamily: fonts.serif, fontSize: '14px', cursor: 'pointer', fontWeight: '600'
            }}>
              ← Home
            </button>
            <div style={{ textAlign: 'center', flex: 1 }}>
              <div style={{ fontSize: '12px', fontFamily: fonts.system, color: ColorScheme.textLight, textTransform: 'uppercase', letterSpacing: '0.5px' }}>
                {chapter.num}
              </div>
              <div style={{ fontSize: '14px', fontFamily: fonts.serif, fontWeight: '600', color: ColorScheme.text }}>
                {chapter.title}
              </div>
            </div>
            <div style={{ position: 'relative' }}>
              <button onClick={() => setShowChapterMenu(!showChapterMenu)} style={{
                background: 'none', border: 'none', color: ColorScheme.accent,
                fontFamily: fonts.serif, fontSize: '14px', cursor: 'pointer',
                display: 'flex', alignItems: 'center', gap: '4px'
              }}>
                Chapters ▾
              </button>
              {showChapterMenu && (
                <div style={{
                  position: 'absolute', top: '100%', right: 0,
                  backgroundColor: ColorScheme.card, border: `1px solid ${ColorScheme.lines}`,
                  borderRadius: '2px', maxHeight: '300px', overflowY: 'auto',
                  zIndex: 200, minWidth: '250px', marginTop: '8px'
                }}>
                  {CHAPTERS.map((ch, i) => (
                    <button
                      key={i}
                      onClick={() => {
                        setCurrentChapterIndex(i);
                        setCurrentPage(0);
                        setShowChapterMenu(false);
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                      }}
                      style={{
                        width: '100%', padding: '12px 16px', textAlign: 'left',
                        border: 'none',
                        background: i === currentChapterIndex ? ColorScheme.accentSoft : 'transparent',
                        cursor: 'pointer', borderBottom: `1px solid ${ColorScheme.lines}`,
                        fontFamily: fonts.serif, fontSize: '12px', color: ColorScheme.text,
                        transition: 'all 0.2s ease'
                      }}
                      onMouseEnter={(e) => { if (i !== currentChapterIndex) e.target.style.backgroundColor = ColorScheme.background; }}
                      onMouseLeave={(e) => { if (i !== currentChapterIndex) e.target.style.backgroundColor = 'transparent'; }}
                    >
                      <div style={{ fontSize: '10px', color: ColorScheme.textLight, marginBottom: '2px' }}>
                        {ch.num}
                      </div>
                      <div style={{ fontWeight: '600' }}>
                        {ch.title}
                      </div>
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>

          <div style={{
            position: 'fixed', top: '70px', left: 0, right: 0, height: '2px',
            backgroundColor: ColorScheme.lines, zIndex: 99
          }}>
            <div style={{
              height: '100%', backgroundColor: ColorScheme.accent,
              width: `${progress}%`, transition: 'width 0.3s ease'
            }} />
          </div>

          <div style={{
            maxWidth: '700px', margin: '0 auto',
            padding: '100px 40px 40px 40px', minHeight: '100vh'
          }}>
            {currentPage === 0 && (
              <div style={{ marginBottom: '60px' }}>
                <div style={{ fontSize: '12px', fontFamily: fonts.system, color: ColorScheme.textLight, letterSpacing: '0.5px', textTransform: 'uppercase', marginBottom: '16px' }}>
                  {chapter.num}
                </div>
                <h1 style={{
                  fontSize: '48px', fontFamily: fonts.serif, fontWeight: '600',
                  color: ColorScheme.text, margin: 0, lineHeight: '1.2'
                }}>
                  {chapter.title}
                </h1>
                <div style={{ fontSize: '14px', fontFamily: fonts.system, color: ColorScheme.textLight, marginTop: '16px' }}>
                  {chapter.time}
                </div>
              </div>
            )}

            <div style={{ marginBottom: '60px' }}>
              {currentParagraphs.map((para, i) => {
                const isFirstParaOfChapter = currentPage === 0 && i === 0;
                const isPullQuote = para.length < 80 && para.length > 10 && !para.endsWith(':');
                const firstLetter = isFirstParaOfChapter ? para.charAt(0) : null;
                const restOfPara = isFirstParaOfChapter ? para.slice(1) : para;

                if (isPullQuote) {
                  return (
                    <div
                      key={i}
                      style={{
                        borderLeft: `4px solid ${ColorScheme.accent}`,
                        padding: '16px 0 16px 24px',
                        margin: '32px 0',
                        animation: `doctrineFadeIn 0.5s ease ${i * 0.15}s both`
                      }}
                    >
                      <p style={{
                        fontSize: '20px', fontFamily: fonts.serif, fontWeight: '600',
                        color: ColorScheme.accent, lineHeight: '1.6', margin: 0, fontStyle: 'italic'
                      }}>
                        {para}
                      </p>
                    </div>
                  );
                }

                return (
                  <p
                    key={i}
                    style={{
                      fontSize: '17px', fontFamily: fonts.serif, color: ColorScheme.text,
                      lineHeight: '1.85', margin: 0, paddingBottom: '24px',
                      animation: `doctrineFadeIn 0.5s ease ${i * 0.15}s both`
                    }}
                  >
                    {isFirstParaOfChapter && (
                      <span style={{
                        float: 'left', fontSize: '64px', lineHeight: '50px',
                        fontWeight: '700', color: ColorScheme.accent, fontFamily: fonts.serif,
                        marginRight: '8px', marginTop: '6px'
                      }}>
                        {firstLetter}
                      </span>
                    )}
                    {isFirstParaOfChapter ? restOfPara : para}
                  </p>
                );
              })}
            </div>

            <div style={{
              display: 'flex', justifyContent: 'space-between', alignItems: 'center',
              padding: '30px 0', borderTop: `1px solid ${ColorScheme.lines}`
            }}>
              <button onClick={goToPrev} disabled={currentChapterIndex === 0 && currentPage === 0} style={{
                padding: '10px 20px', backgroundColor: ColorScheme.accentSoft, color: ColorScheme.text,
                border: 'none', borderRadius: '2px', fontFamily: fonts.serif, fontSize: '14px',
                cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '8px',
                opacity: currentChapterIndex === 0 && currentPage === 0 ? 0.3 : 1,
                transition: 'all 0.3s ease'
              }}
              onMouseEnter={(e) => { if (!(currentChapterIndex === 0 && currentPage === 0)) { e.target.style.backgroundColor = ColorScheme.accent; e.target.style.color = ColorScheme.card; } }}
              onMouseLeave={(e) => { e.target.style.backgroundColor = ColorScheme.accentSoft; e.target.style.color = ColorScheme.text; }}
              >
                ← Previous
              </button>

              <div style={{ display: 'flex', gap: '8px' }}>
                {Array.from({ length: totalPages }).map((_, i) => (
                  <button
                    key={i}
                    onClick={() => { setCurrentPage(i); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                    style={{
                      width: '8px', height: '8px', borderRadius: '50%',
                      backgroundColor: i === currentPage ? ColorScheme.accent : ColorScheme.lines,
                      border: 'none', cursor: 'pointer', transition: 'all 0.3s ease'
                    }}
                  />
                ))}
              </div>

              <button onClick={goToNext} disabled={currentChapterIndex === CHAPTERS.length - 1 && currentPage === totalPages - 1} style={{
                padding: '10px 20px', backgroundColor: ColorScheme.accentSoft, color: ColorScheme.text,
                border: 'none', borderRadius: '2px', fontFamily: fonts.serif, fontSize: '14px',
                cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '8px',
                opacity: currentChapterIndex === CHAPTERS.length - 1 && currentPage === totalPages - 1 ? 0.3 : 1,
                transition: 'all 0.3s ease'
              }}
              onMouseEnter={(e) => { if (!(currentChapterIndex === CHAPTERS.length - 1 && currentPage === totalPages - 1)) { e.target.style.backgroundColor = ColorScheme.accent; e.target.style.color = ColorScheme.card; } }}
              onMouseLeave={(e) => { e.target.style.backgroundColor = ColorScheme.accentSoft; e.target.style.color = ColorScheme.text; }}
              >
                Next →
              </button>
            </div>
          </div>
        </div>
      );
    };

    const TopNav = ({ mode, onNavigate }) => {
      if (mode !== 'home') return null;
      return (
        <div style={{
          position: 'fixed', top: 0, left: 0, right: 0,
          backgroundColor: ColorScheme.card, borderBottom: `1px solid ${ColorScheme.lines}`,
          padding: '16px 40px', display: 'flex', justifyContent: 'space-between',
          alignItems: 'center', zIndex: 50
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
            <a href="execution-doctrine-book.html" style={{
              color: ColorScheme.textMedium, textDecoration: 'none',
              fontFamily: fonts.serif, fontSize: '13px', fontWeight: '500',
              marginRight: '6px'
            }}>← Site</a>
            <div style={{
              width: '32px', height: '32px', borderRadius: '50%',
              background: `linear-gradient(135deg, ${ColorScheme.accentLight}, ${ColorScheme.accent})`,
              display: 'flex', alignItems: 'center', justifyContent: 'center'
            }}>
              <span style={{ fontSize: '16px', fontFamily: fonts.serif, fontWeight: '700', color: ColorScheme.card }}>V</span>
            </div>
            <div style={{ fontSize: '14px', fontFamily: fonts.serif, fontWeight: '600', color: ColorScheme.text }}>
              Vinay's Execution Doctrine
            </div>
          </div>
          <div style={{ display: 'flex', gap: '30px', fontSize: '14px', fontFamily: fonts.serif }}>
            <button onClick={() => onNavigate('home')} style={{
              background: 'none', border: 'none', color: ColorScheme.text,
              cursor: 'pointer', fontWeight: '500', transition: 'color 0.3s ease'
            }}
            onMouseEnter={(e) => { e.target.style.color = ColorScheme.accent; }}
            onMouseLeave={(e) => { e.target.style.color = ColorScheme.text; }}
            >
              Home
            </button>
            <button onClick={() => onNavigate('read')} style={{
              background: 'none', border: 'none', color: ColorScheme.accent,
              cursor: 'pointer', fontWeight: '600'
            }}>
              Read
            </button>
          </div>
        </div>
      );
    };

    function DoctrineApp() {
      const [mode, setMode] = useState('home');
      const [startChapter, setStartChapter] = useState(0);

      const handleStartReading = (chapterIndex) => {
        setStartChapter(typeof chapterIndex === 'number' ? chapterIndex : 0);
        setMode('read');
      };

      useEffect(() => {
        const loader = document.getElementById('doctrine-loading');
        if (loader) loader.remove();
        const link = document.getElementById('back-to-site');
        // Show the floating "back to site" link only in reader mode
        if (link) link.style.display = mode === 'read' ? 'block' : 'none';
      }, [mode]);

      return (
        <div style={{
          backgroundColor: ColorScheme.background, color: ColorScheme.text,
          fontFamily: fonts.serif, minHeight: '100vh'
        }}>
          <StyleInjector />
          <NetworkBackground />
          <TopNav mode={mode} onNavigate={setMode} />
          {mode === 'home' ? (
            <HomePage onStartReading={handleStartReading} />
          ) : (
            <ReaderPage onBack={() => setMode('home')} initialChapter={startChapter} />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DoctrineApp />);
  </script>
</body>
</html>
