<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Analytics 4 -->
  <script defer src="../js/analytics.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>The Signal — Session 0 with Vinay Pasricha</title>
  <meta name="description" content="A diagnostic resonance encounter. Convert emotional turbulence into visible structure through slow precision descent. Free, private, no signup.">
  <link rel="canonical" href="https://vinaypasricha.com/pages/the-signal.html">
  <!-- Open Graph -->
  <meta property="og:title" content="The Signal — Session 0">
  <meta property="og:description" content="A diagnostic resonance encounter. Convert emotional turbulence into visible structure through slow precision descent.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://vinaypasricha.com/pages/the-signal.html">
  <meta property="og:image" content="https://vinaypasricha.com/assets/images/vinay-avatar.png">
  <meta property="og:site_name" content="Vinay Pasricha">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="The Signal — Session 0">
  <meta name="twitter:description" content="A diagnostic resonance encounter. Convert emotional turbulence into visible structure through slow precision descent.">
  <meta name="twitter:image" content="https://vinaypasricha.com/assets/images/vinay-avatar.png">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "The Signal — Session 0",
    "description": "A diagnostic resonance encounter that converts emotional turbulence into visible structure.",
    "url": "https://vinaypasricha.com/pages/the-signal.html",
    "author": { "@type": "Person", "name": "Vinay Pasricha", "url": "https://vinaypasricha.com" },
    "applicationCategory": "Lifestyle",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0E0D0B;
      --bg-elevated: #14130F;
      --surface: #1B1A15;
      --surface-2: #232118;
      --border: #2A2820;
      --border-strong: #3A3729;
      --text: #F2EDE0;
      --text-soft: #B5AC97;
      --text-mute: #6F6852;
      --accent: #C9A24A;
      --accent-soft: #8B6914;
      --error: #C66B5C;
      --error-bg: #2A1812;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Fraunces', Georgia, serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; min-height: 100vh; min-height: 100dvh; overscroll-behavior: none; }
    button, input, textarea { font-family: inherit; }
    a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }

    /* Subtle ambient grain */
    body::before {
      content: '';
      position: fixed; inset: 0;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.78 0 0 0 0 0.65 0 0 0 0 0.30 0 0 0 0.04 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.4;
      mix-blend-mode: overlay;
      z-index: 1;
    }

    .signal-shell { position: relative; z-index: 2; max-width: 760px; margin: 0 auto; padding: 24px 20px 200px; min-height: 100vh; min-height: 100dvh; }

    /* Header */
    .signal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0 28px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
    }
    .signal-back {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 12px; font-weight: 500;
      color: var(--text-mute); letter-spacing: 0.4px;
      transition: color 200ms;
    }
    .signal-back:hover { color: var(--accent); }
    .signal-brand {
      display: flex; align-items: center; gap: 8px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--accent); font-weight: 700;
    }
    .signal-brand-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .signal-restart {
      background: transparent;
      border: 1px solid var(--border-strong);
      color: var(--text-soft);
      padding: 7px 14px;
      border-radius: 100px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 11px; font-weight: 500; letter-spacing: 0.3px;
      cursor: pointer;
      transition: all 200ms;
    }
    .signal-restart:hover { border-color: var(--accent); color: var(--accent); }

    /* Hero — only shows before first message */
    .signal-hero {
      padding: 32px 0 56px;
      animation: fadeIn 600ms ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .signal-eyebrow {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--accent); font-weight: 600;
      margin-bottom: 18px;
    }
    .signal-title {
      font-size: clamp(40px, 7vw, 64px); font-weight: 600;
      color: var(--text); margin: 0 0 20px;
      letter-spacing: -1.2px; line-height: 1.05;
    }
    .signal-title em { font-style: italic; color: var(--accent); font-weight: 500; }
    .signal-tagline {
      font-size: 18px; line-height: 1.55;
      color: var(--text-soft); margin: 0 0 28px;
      max-width: 580px;
      font-weight: 400;
    }
    .signal-meta {
      display: flex; gap: 18px; flex-wrap: wrap;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 11px; letter-spacing: 0.6px; text-transform: uppercase;
      color: var(--text-mute); font-weight: 500;
    }
    .signal-meta span { display: inline-flex; align-items: center; gap: 6px; }
    .signal-meta span::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--text-mute); }

    /* Messages */
    .signal-messages {
      display: flex; flex-direction: column; gap: 14px;
      padding-bottom: 12px;
    }
    .signal-msg {
      max-width: 92%;
      padding: 16px 20px;
      font-size: 17px; line-height: 1.62;
      white-space: pre-wrap; word-wrap: break-word;
      animation: msgIn 320ms cubic-bezier(0.2, 0.7, 0.3, 1);
    }
    @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .signal-msg.assistant {
      align-self: flex-start;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px 18px 18px 18px;
      box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 16px 32px -24px rgba(0,0,0,0.6);
    }
    .signal-msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: #1A1610;
      border-radius: 18px 4px 18px 18px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 15px; font-weight: 500;
      letter-spacing: -0.01em;
      box-shadow: 0 8px 24px -12px rgba(201,162,74,0.35);
    }
    .signal-msg.assistant.thinking {
      color: var(--text-mute);
      font-style: italic;
      display: inline-flex; align-items: center; gap: 10px;
      background: transparent;
      border-color: transparent;
      box-shadow: none;
    }
    .signal-thinking-dots {
      display: inline-flex; gap: 4px;
    }
    .signal-thinking-dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      animation: dot 1.2s ease-in-out infinite;
    }
    .signal-thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .signal-thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot { 0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); } 40% { opacity: 1; transform: scale(1); } }

    .signal-error {
      align-self: stretch;
      max-width: 100%;
      padding: 14px 18px;
      background: var(--error-bg);
      color: var(--error);
      border: 1px solid var(--error);
      border-radius: 8px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 13px; line-height: 1.5;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    }
    .signal-error-retry {
      background: var(--error);
      color: #1A1610;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px; font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .signal-error-retry:hover { background: #DC8478; }

    /* Sentinel for reliable scroll */
    .signal-bottom-anchor { height: 1px; }

    /* Composer */
    .signal-composer-wrap {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, var(--bg) 60%, rgba(14,13,11,0.85) 88%, rgba(14,13,11,0));
      padding: 32px 20px 24px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      z-index: 10;
    }
    .signal-composer {
      max-width: 760px; margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      padding: 6px;
      display: flex; gap: 4px;
      transition: border-color 200ms;
      box-shadow: 0 24px 48px -24px rgba(0,0,0,0.7);
    }
    .signal-composer:focus-within { border-color: var(--accent); }
    .signal-textarea {
      flex: 1;
      resize: none;
      min-height: 52px; max-height: 200px;
      padding: 14px 16px;
      font-family: 'Fraunces', Georgia, serif;
      font-size: 17px; line-height: 1.5;
      color: var(--text);
      background: transparent;
      border: none;
      outline: none;
    }
    .signal-textarea::placeholder { color: var(--text-mute); font-style: italic; }
    .signal-textarea:disabled { opacity: 0.5; cursor: not-allowed; }
    .signal-send {
      align-self: flex-end;
      padding: 0;
      width: 48px; height: 48px;
      background: var(--accent);
      color: #1A1610;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      transition: all 200ms;
      flex-shrink: 0;
    }
    .signal-send:hover:not(:disabled) { background: #DDB95A; transform: translateY(-1px); }
    .signal-send:disabled { background: var(--border-strong); color: var(--text-mute); cursor: not-allowed; }
    .signal-send svg { width: 18px; height: 18px; }

    .signal-hint {
      max-width: 760px; margin: 8px auto 0;
      text-align: center;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 11px; color: var(--text-mute); letter-spacing: 0.4px;
    }

    @media (max-width: 600px) {
      .signal-shell { padding: 16px 16px 200px; }
      .signal-hero { padding: 16px 0 36px; }
      .signal-msg { font-size: 16px; padding: 14px 16px; }
      .signal-msg.user { font-size: 14px; }
      .signal-textarea { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div id="signal-root"></div>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useCallback } = React;
    const STORAGE_KEY = 'thesignal:session:v2';

    function loadSession() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch { return []; }
    }
    function saveSession(messages) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(messages)); } catch {}
    }

    const OPENING = 'Tell me what is creating the most internal friction right now. Do not summarize it. Give it to me as it is.';

    function App() {
      const [messages, setMessages] = useState(() => loadSession());
      const [input, setInput] = useState('');
      const [pending, setPending] = useState(false);
      const [error, setError] = useState(null);
      const [lastFailedMessages, setLastFailedMessages] = useState(null);
      const bottomRef = useRef(null);
      const textareaRef = useRef(null);

      const hasUserMessage = messages.some(m => m.role === 'user');

      // Auto-start: insert opening if no messages yet
      useEffect(() => {
        if (messages.length === 0) {
          setMessages([{ role: 'assistant', content: OPENING }]);
          if (window.trackEvent) window.trackEvent('signal_session_started');
        }
      }, []);

      // Persist
      useEffect(() => { saveSession(messages); }, [messages]);

      // Auto-scroll on every change. Use scrollIntoView on a sentinel for reliability.
      useEffect(() => {
        // Wait one frame so layout settles, then scroll
        requestAnimationFrame(() => {
          if (bottomRef.current) {
            bottomRef.current.scrollIntoView({ behavior: 'smooth', block: 'end' });
          }
        });
      }, [messages, pending, error]);

      // Auto-resize textarea
      useEffect(() => {
        const el = textareaRef.current;
        if (el) {
          el.style.height = 'auto';
          el.style.height = Math.min(el.scrollHeight, 200) + 'px';
        }
      }, [input]);

      const callApi = useCallback(async (msgList) => {
        setError(null);
        setPending(true);
        try {
          const res = await fetch('/api/signal-chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: msgList })
          });
          const data = await res.json();
          if (!res.ok) {
            const msg = data.error || `Error ${res.status}`;
            throw new Error(msg);
          }
          setMessages([...msgList, data.message]);
          setLastFailedMessages(null);
          if (window.trackEvent) window.trackEvent('signal_message_exchanged', { msg_count: msgList.length + 1 });
        } catch (e) {
          setError(String(e.message || e));
          setLastFailedMessages(msgList);
        } finally {
          setPending(false);
        }
      }, []);

      const send = useCallback(() => {
        const text = input.trim();
        if (!text || pending) return;
        const next = [...messages, { role: 'user', content: text }];
        setMessages(next);
        setInput('');
        callApi(next);
      }, [input, messages, pending, callApi]);

      const retry = () => {
        if (lastFailedMessages) callApi(lastFailedMessages);
      };

      const onKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      };

      const restart = () => {
        if (!confirm('Start a new session? Your current conversation will be cleared.')) return;
        localStorage.removeItem(STORAGE_KEY);
        setMessages([{ role: 'assistant', content: OPENING }]);
        setError(null);
        setLastFailedMessages(null);
        if (window.trackEvent) window.trackEvent('signal_session_restarted');
      };

      return (
        <div className="signal-shell">
          <header className="signal-header">
            <a href="../index.html" className="signal-back">&larr; vinaypasricha.com</a>
            <div className="signal-brand">
              <span className="signal-brand-dot"></span>
              The Signal
            </div>
            <button className="signal-restart" onClick={restart}>New Session</button>
          </header>

          {!hasUserMessage && (
            <section className="signal-hero">
              <div className="signal-eyebrow">Session 0 · The Split</div>
              <h1 className="signal-title">A diagnostic <em>resonance</em> encounter.</h1>
              <p className="signal-tagline">Take whatever is generating internal noise right now and reduce it into visible structure — slowly, precisely, until you can see the split that is actually creating the friction. No therapy. No advice. Only earned structure.</p>
              <div className="signal-meta">
                <span>Free</span>
                <span>Private</span>
                <span>No signup</span>
                <span>Stays in your browser</span>
              </div>
            </section>
          )}

          <main className="signal-messages">
            {messages.map((m, i) => (
              <div key={i} className={`signal-msg ${m.role}`}>{m.content}</div>
            ))}
            {pending && (
              <div className="signal-msg assistant thinking">
                Listening
                <span className="signal-thinking-dots"><span></span><span></span><span></span></span>
              </div>
            )}
            {error && (
              <div className="signal-error">
                <div>
                  <strong>Couldn't reach the model.</strong><br />
                  {error}
                </div>
                {lastFailedMessages && (
                  <button className="signal-error-retry" onClick={retry}>Retry</button>
                )}
              </div>
            )}
            <div ref={bottomRef} className="signal-bottom-anchor"></div>
          </main>

          <div className="signal-composer-wrap">
            <div className="signal-composer">
              <textarea
                ref={textareaRef}
                className="signal-textarea"
                value={input}
                onChange={(e) => setInput(e.target.value)}
                onKeyDown={onKeyDown}
                placeholder="Speak as it is. Do not summarize."
                disabled={pending}
                rows={1}
              />
              <button className="signal-send" onClick={send} disabled={pending || !input.trim()} aria-label="Send">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="13 6 19 12 13 18"></polyline></svg>
              </button>
            </div>
            <div className="signal-hint">Enter to send · Shift + Enter for a new line</div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('signal-root')).render(<App />);
  </script>
</body>
</html>
